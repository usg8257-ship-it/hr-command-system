<script>
'use strict';

// ============================================================
// FLAG MAP
// ============================================================
var FLAG_MAP={'INDIA':'🇮🇳','PAKISTAN':'🇵🇰','PHILIPPINES':'🇵🇭','NEPAL':'🇳🇵','SRI LANKA':'🇱🇰','BANGLADESH':'🇧🇩','EGYPT':'🇪🇬','KENYA':'🇰🇪','NIGERIA':'🇳🇬','ETHIOPIA':'🇪🇹','UGANDA':'🇺🇬','GHANA':'🇬🇭','JORDAN':'🇯🇴','INDONESIA':'🇮🇩','UAE':'🇦🇪','SAUDI ARABIA':'🇸🇦','MYANMAR':'🇲🇲','VIETNAM':'🇻🇳','THAILAND':'🇹🇭','CHINA':'🇨🇳','MOROCCO':'🇲🇦','TANZANIA':'🇹🇿','SOUTH AFRICA':'🇿🇦','ZIMBABWE':'🇿🇼','SUDAN':'🇸🇩'};
function getFlag(nat){ return FLAG_MAP[String(nat||'').toUpperCase()]||'🌍'; }

// ENTITY normalise (4 valid: USG, UG, UST, USG-M)
function normEnt(raw){
  var v=String(raw||'').trim().toUpperCase();
  if(v==='UGU'||v==='USU') return 'UG';
  if(v==='USG-M') return 'USG-M';
  if(v==='USG') return 'USG';
  if(v==='UG') return 'UG';
  if(v==='UST') return 'UST';
  return v||null;
}

// ============================================================
// APP STATE
// ============================================================
var APP={config:{},master:[],deletions:[],onboarding:[],hrDocs:[],summary:[],loaded:false,user:{email:'',name:'',role:'',entities:[],active:true},token:''};
// Track if any modal is open (to block auto-refresh during editing)
var EDITING=false;

function getActiveEmployees(){
  var delIds={};
  APP.deletions.forEach(function(d){ if(d.EMP_ID) delIds[String(d.EMP_ID).trim()]=true; });
  // deduplicate by ID
  var seen={},result=[];
  APP.master.forEach(function(r){
    var id=String(r.ID||'').trim();
    if(!id) return;
    if(seen[id]) return;
    if(r.STATUS==='DELETED'||delIds[id]) return;
    seen[id]=true;
    result.push(r);
  });
  return result;
}

// ============================================================
// UTILITIES
// ============================================================
function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function today(){ return new Date().toISOString().split('T')[0]; }
function todayDisplay(){ return new Date().toLocaleDateString('en-AE',{day:'2-digit',month:'long',year:'numeric'}); }
// Normalise any date string to DD/MM/YYYY for display
function fmtD(s){
  if(!s||s==='—') return s||'—';
  var m;
  m=String(s).match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if(m) return s;
  m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);    if(m) return m[3]+'/'+m[2]+'/'+m[1];
  var d=new Date(s); if(!isNaN(d)) return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear();
  return s;
}
function genId(p){ return (p||'ID')+'-'+Date.now().toString().slice(-8); }

// ============================================================
// MULTI-SELECT CHECKBOX DROPDOWN
// ============================================================
var MultiSel={
  // Toggle open/close a dropdown
  toggle:function(id){
    var wrap=document.getElementById(id); if(!wrap) return;
    var drop=wrap.querySelector('.ms-drop');
    var opening=!drop.classList.contains('open');
    // close all others first
    document.querySelectorAll('.ms-drop.open').forEach(function(d){ d.classList.remove('open'); });
    document.querySelectorAll('.ms-wrap.ms-open').forEach(function(w){ w.classList.remove('ms-open'); });
    if(opening){ drop.classList.add('open'); wrap.classList.add('ms-open'); }
  },
  // Get array of checked values for a ms-wrap
  get:function(id){
    var wrap=document.getElementById(id); if(!wrap) return [];
    var vals=[];
    wrap.querySelectorAll('input[type=checkbox]:checked').forEach(function(cb){ vals.push(cb.value); });
    return vals;
  },
  // Reset all checkboxes in a ms-wrap to unchecked
  reset:function(id){
    var wrap=document.getElementById(id); if(!wrap) return;
    wrap.querySelectorAll('input[type=checkbox]').forEach(function(cb){ cb.checked=false; });
    MultiSel._sync(id);
  },
  // Update label and active class after checkbox change
  _sync:function(id){
    var wrap=document.getElementById(id); if(!wrap) return;
    var vals=MultiSel.get(id);
    var label=wrap.querySelector('.ms-label');
    if(label){
      if(!vals.length){
        // Restore placeholder from first option's text or default
        var placeholder=wrap.querySelector('.ms-btn').dataset.placeholder||'All';
        label.innerHTML=esc(placeholder);
      } else if(vals.length<=2){
        label.innerHTML=vals.map(function(v){ return esc(v); }).join(', ');
      } else {
        label.innerHTML=vals[0]+' <span class="ms-sel-cnt">+'+( vals.length-1)+'</span>';
      }
    }
    if(vals.length) wrap.classList.add('ms-active');
    else wrap.classList.remove('ms-active');
  },
  // Build a dynamic dropdown (used for year / designation lists)
  build:function(dropId,options,syncId){
    var drop=document.getElementById(dropId); if(!drop) return;
    drop.innerHTML=options.map(function(o){
      return '<label class="ms-item"><input type="checkbox" value="'+esc(o.value)+'" onchange="MultiSel._sync(\''+syncId+'\')"> '+esc(o.label)+'</label>';
    }).join('');
    MultiSel.reset(syncId);
  }
};
// Close any open multi-select when clicking outside
document.addEventListener('click',function(e){
  if(!e.target.closest('.ms-wrap')){
    document.querySelectorAll('.ms-drop.open').forEach(function(d){ d.classList.remove('open'); });
    document.querySelectorAll('.ms-wrap.ms-open').forEach(function(w){ w.classList.remove('ms-open'); });
  }
});

function toast(msg,type){
  var box=document.getElementById('tbox');
  var el=document.createElement('div'); el.className='toast t-'+(type||'info'); el.textContent=msg;
  box.appendChild(el);
  setTimeout(function(){ el.style.opacity='0'; el.style.transform='translateX(110%)'; el.style.transition='.3s'; setTimeout(function(){ el.remove(); },300); },3500);
}
function toastAction(msg,btnLabel,onYes){
  var box=document.getElementById('tbox');
  var el=document.createElement('div'); el.className='toast t-success'; el.style.cssText='display:flex;align-items:center;gap:10px;padding:12px 14px;';
  el.innerHTML='<span style="flex:1">'+msg+'</span>'+
    '<button style="background:var(--navy);color:#fff;border:none;border-radius:5px;padding:4px 10px;font-size:11.5px;cursor:pointer;white-space:nowrap">'+btnLabel+'</button>'+
    '<button style="background:transparent;color:rgba(255,255,255,0.7);border:none;font-size:14px;cursor:pointer;padding:0 2px" title="Dismiss">&times;</button>';
  var timer=setTimeout(function(){ el.remove(); },8000);
  el.querySelectorAll('button')[0].onclick=function(){ clearTimeout(timer); el.remove(); onYes(); };
  el.querySelectorAll('button')[1].onclick=function(){ clearTimeout(timer); el.remove(); };
  box.appendChild(el);
}
function openM(id){ EDITING=true; document.getElementById(id).classList.add('show'); }
function closeM(id){ document.getElementById(id).classList.remove('show'); EDITING=false; }
document.addEventListener('click',function(e){ if(e.target.classList.contains('modal-overlay')){ e.target.classList.remove('show'); EDITING=false; } });

// ============================================================
// EXPERIENCE LETTER — PDF download helper + trigger
// ============================================================
function _downloadPdf(base64, filename) {
  var bytes = new Uint8Array(atob(base64).split('').map(function(c){ return c.charCodeAt(0); }));
  var blob = new Blob([bytes], {type:'application/pdf'});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}
// Extract page 2 (skip blank template cover) and open result modal with Download + Print
function _openExpPdfResult(base64, filename) {
  var bytes = new Uint8Array(atob(base64).split('').map(function(c){ return c.charCodeAt(0); }));
  PDFLib.PDFDocument.load(bytes).then(function(srcDoc){
    var pageIdx = srcDoc.getPageCount() >= 2 ? 1 : 0;
    return PDFLib.PDFDocument.create().then(function(newDoc){
      return newDoc.copyPages(srcDoc, [pageIdx]).then(function(copied){
        newDoc.addPage(copied[0]);
        return newDoc.save();
      });
    });
  }).then(function(pdfBytes){
    var blob = new Blob([pdfBytes], {type:'application/pdf'});
    _openPdfResult(URL.createObjectURL(blob), filename);
  }).catch(function(){
    var blob = new Blob([bytes], {type:'application/pdf'});
    _openPdfResult(URL.createObjectURL(blob), filename);
  });
}

// Merge multiple raw base64 PDFs (each stripping blank first page), then invoke cb(blobUrl)
function _mergeBulkExpPdfs(base64Array, cb) {
  PDFLib.PDFDocument.create().then(function(mergedDoc){
    var chain = Promise.resolve();
    base64Array.forEach(function(b64){
      chain = chain.then(function(){
        var b = new Uint8Array(atob(b64).split('').map(function(c){ return c.charCodeAt(0); }));
        return PDFLib.PDFDocument.load(b).then(function(srcDoc){
          var pi = srcDoc.getPageCount() >= 2 ? 1 : 0;
          return mergedDoc.copyPages(srcDoc, [pi]).then(function(cp){ mergedDoc.addPage(cp[0]); });
        }).catch(function(){});
      });
    });
    return chain.then(function(){ return mergedDoc.save(); });
  }).then(function(pdfBytes){
    cb(URL.createObjectURL(new Blob([pdfBytes], {type:'application/pdf'})));
  });
}

// Show PDF result modal wired to a blob URL
function _openPdfResult(url, filename) {
  var dl = document.getElementById('pdf-download-btn');
  if(dl) dl.onclick = function(){ var a=document.createElement('a'); a.href=url; a.download=filename; a.click(); };
  var pr = document.getElementById('pdf-print-btn');
  if(pr) pr.onclick = function(){ var w=window.open(url); if(w) w.onload=function(){ w.print(); }; };
  var lbl = document.getElementById('pdf-result-label');
  if(lbl) lbl.textContent = filename;
  openM('m-pdf-result');
}

function genExpLetter(empId, name, onDone) {
  var btn = document.querySelector('[data-exltr="'+empId+'"]');
  if(btn){ btn.disabled = true; btn.textContent = '…'; }
  if(!onDone) toast('Generating experience letter for '+esc(name||empId)+'…','info');
  GAS.generateExperienceLetterForEmp(empId, function(r) {
    if(btn){ btn.disabled = false; btn.innerHTML = '&#128196; Generate'; }
    if(!r) { toast('No response from server','error'); if(typeof onDone==='function') onDone(null); return; }
    if(!r.success) { toast('Error: '+r.error,'error'); if(typeof onDone==='function') onDone(null); return; }
    toast('Generated: '+r.refNo,'success');
    if(typeof onDone === 'function') {
      onDone(r.pdf || null);  // bulk mode: pass raw base64 to caller for merging
    } else {
      // Single mode: show download + print modal
      if(r.pdf) _openExpPdfResult(r.pdf, 'Experience_Letter_'+(name||empId).replace(/\s+/g,'_')+'.pdf');
      GAS.call('getHRDocs',[],function(dr){
        if(dr&&dr.success){ APP.hrDocs=dr.data||[]; LtrAgent.render(); LtrAgent.renderExpPanel(); }
      });
    }
  });
}

// ============================================================
// GLOBAL SEARCH — searches ID, Name, Passport No, EID No
// ============================================================
var GlobalSearch = {
  _timer: null,
  _lastQ: '',

  query: function(q) {
    var self = this;
    q = String(q||'').trim();
    var clearBtn = document.getElementById('gsearch-clear');
    if(clearBtn) clearBtn.style.display = q ? 'block' : 'none';
    clearTimeout(this._timer);
    if(!q){ this.hide(); this._lastQ=''; return; }
    this._timer = setTimeout(function(){ self._run(q); }, 180);
  },

  _run: function(q) {
    this._lastQ = q;
    var ql = q.toLowerCase();
    var results = [];

    // Search active employees across 4 fields
    getActiveEmployees().forEach(function(r){
      var id   = String(r.ID||'').toLowerCase();
      var name = String(r.NAME||'').toLowerCase();
      var pp   = String(r['PASSPORT NO']||'').toLowerCase();
      var eid  = String(r['EID NO']||'').toLowerCase();
      if(id.indexOf(ql)>=0 || name.indexOf(ql)>=0 || pp.indexOf(ql)>=0 || eid.indexOf(ql)>=0){
        results.push({type:'emp', data:r});
      }
      if(results.length >= 12) return;
    });

    // Also search onboarding
    APP.onboarding.forEach(function(c){
      if(results.length >= 15) return;
      var name = String(c.FULL_NAME||'').toLowerCase();
      var pp   = String(c.PASSPORT_NO||'').toLowerCase();
      if(name.indexOf(ql)>=0 || pp.indexOf(ql)>=0){
        results.push({type:'ob', data:c});
      }
    });

    this._render(results, q);
  },

  _hl: function(text, q) {
    if(!q || !text) return esc(text);
    var escaped = esc(text);
    var escapedQ = esc(q);
    var re = new RegExp('('+escapedQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')', 'gi');
    return escaped.replace(re, '<mark class="hl">$1</mark>');
  },

  _render: function(results, q) {
    var box = document.getElementById('gsearch-results'); if(!box) return;
    box.classList.add('open');

    if(!results.length){
      box.innerHTML = '<div class="gsearch-header"><span>Search Results</span><span>0 found</span></div><div class="gsearch-empty">&#128269; No results for &ldquo;'+esc(q)+'&rdquo;<br><span style="font-size:10.5px">Try ID, name, passport no, or EID</span></div>';
      return;
    }

    var empCount = results.filter(function(r){ return r.type==='emp'; }).length;
    var obCount  = results.filter(function(r){ return r.type==='ob';  }).length;

    var html = '<div class="gsearch-header"><span>Search Results</span><span>'+results.length+' found</span></div>';

    var self = this;
    results.forEach(function(item){
      if(item.type === 'emp'){
        var r = item.data;
        var initials = (r.NAME||'?').substring(0,2).toUpperCase();
        var licCls = {PSBD:'bp',SIRA:'bs',NIL:'bn',OTHER:'bo'}[r['LIC AUTH']||'NIL']||'bn';
        html += '<div class="gsearch-item" onclick="GlobalSearch.showDetail(\''+esc(r.ID||'')+'\')">'+
          '<div class="gsearch-avatar">'+esc(initials)+'</div>'+
          '<div class="gsearch-info">'+
            '<div class="gsearch-name">'+self._hl(r.NAME||'—', q)+'</div>'+
            '<div class="gsearch-meta">ID: '+self._hl(r.ID||'—',q)+' &nbsp;|&nbsp; PP: '+self._hl(r['PASSPORT NO']||'—',q)+' &nbsp;|&nbsp; EID: '+self._hl(r['EID NO']||'—',q)+'</div>'+
          '</div>'+
          '<span class="gsearch-tag badge '+licCls+'">'+esc(r['LIC AUTH']||'NIL')+'</span>'+
        '</div>';
      } else {
        var c = item.data;
        var initials2 = (c.FULL_NAME||'?').substring(0,2).toUpperCase();
        html += '<div class="gsearch-item" style="opacity:.85" onclick="GlobalSearch.showOnboardDetail(\''+esc(c.OB_ID||'')+'\')">'+
          '<div class="gsearch-avatar" style="background:linear-gradient(135deg,#b87000,#8a5200)">'+esc(initials2)+'</div>'+
          '<div class="gsearch-info">'+
            '<div class="gsearch-name">'+self._hl(c.FULL_NAME||'—',q)+'</div>'+
            '<div class="gsearch-meta">Onboarding &nbsp;|&nbsp; PP: '+self._hl(c.PASSPORT_NO||'—',q)+' &nbsp;|&nbsp; Status: '+esc(c.STATUS||'—')+'</div>'+
          '</div>'+
          '<span class="gsearch-tag badge bo">OB</span>'+
        '</div>';
      }
    });

    box.innerHTML = html;
  },

  showDetail: function(empId) {
    var r = APP.master.find(function(x){ return x.ID === empId; });
    if(!r){ toast('Employee not found','error'); return; }
    this.clear();

    var licCls  = {PSBD:'bp',SIRA:'bs',NIL:'bn',OTHER:'bo'}[r['LIC AUTH']||'NIL']||'bn';
    var locColor = r.STATUS==='ABU DHABI'?'#1e4799':r.STATUS==='DUBAI'?'#007a8a':'var(--muted)';
    var initials = (r.NAME||'?').substring(0,2).toUpperCase();
    // Calculate years & months of service from Date of Join to today
    var _calcDays = function(doj){
      if(!doj||doj==='—') return '—';
      var d = doj instanceof Date ? doj : new Date(String(doj).split('/').length===3 ? String(doj).split('/').reverse().join('-') : doj);
      if(isNaN(d.getTime())) return '—';
      var now=new Date(), y=now.getFullYear()-d.getFullYear(), m=now.getMonth()-d.getMonth();
      if(m<0){ y--; m+=12; }
      if(y<0) return '—';
      var parts=[];
      if(y>0) parts.push(y+' yr'+(y>1?'s':''));
      if(m>0) parts.push(m+' mo'+(m>1?'s':''));
      return parts.length?parts.join(' '):'< 1 month';
    };

    var body = document.getElementById('empdetail-body');
    body.innerHTML =
      '<div class="empdetail-head">'+
        '<div class="empdetail-avatar">'+esc(initials)+'</div>'+
        '<div class="empdetail-headinfo">'+
          '<div class="ename">'+esc(r.NAME||'—')+'</div>'+
          '<div class="emeta">'+
            '<span class="badge '+licCls+'" style="margin-right:5px">'+esc(r['LIC AUTH']||'NIL')+'</span>'+
            '<span style="color:'+locColor+';font-weight:700;font-size:11px">'+esc(r.STATUS||'—')+'</span>'+
          '</div>'+
        '</div>'+
      '</div>'+
      '<div class="empdetail-grid">'+
        '<div class="empdetail-row"><div class="empdetail-label">Employee ID</div><div class="empdetail-val">'+esc(r.ID||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Entity / Company</div><div class="empdetail-val">'+esc(normEnt(r.ENTITY)||'—')+'</div></div>'+
        '<div class="empdetail-row full"><div class="empdetail-label">Full Name</div><div class="empdetail-val">'+esc(r.NAME||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Passport No</div><div class="empdetail-val" style="font-family:monospace;font-size:12px">'+esc(r['PASSPORT NO']||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Emirates ID</div><div class="empdetail-val" style="font-family:monospace;font-size:12px;color:var(--teal)">'+esc(r['EID NO']||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Nationality</div><div class="empdetail-val">'+getFlag(r.NATIONALITY||'')+' '+esc(r.NATIONALITY||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Designation</div><div class="empdetail-val">'+esc(r.DESIGNATION||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Date of Joining</div><div class="empdetail-val">'+fmtD(r['DATE OF JOIN']||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Date of Birth</div><div class="empdetail-val">'+fmtD(r['BIRTH DATE']||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Age</div><div class="empdetail-val">'+esc(r.AGE||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Location / Visa</div><div class="empdetail-val">'+esc(r.STATUS||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Days of Service</div><div class="empdetail-val">'+_calcDays(r['DATE OF JOIN'])+'</div></div>'+
      '</div>';

    // Wire edit button
    var editBtn = document.getElementById('empdetail-edit-btn');
    if(editBtn){
      editBtn.onclick = function(){
        closeM('m-empdetail');
        EmpAgent.openEdit(empId);
      };
    }
    openM('m-empdetail');
  },

  showOnboardDetail: function(obId) {
    var c = APP.onboarding.find(function(x){ return x.OB_ID === obId; });
    if(!c){ toast('Candidate not found','error'); return; }
    this.clear();
    var initials = (c.FULL_NAME||'?').substring(0,2).toUpperCase();
    var body = document.getElementById('empdetail-body');
    body.innerHTML =
      '<div class="empdetail-head">'+
        '<div class="empdetail-avatar" style="background:linear-gradient(135deg,#b87000,#8a5200)">'+esc(initials)+'</div>'+
        '<div class="empdetail-headinfo">'+
          '<div class="ename">'+esc(c.FULL_NAME||'—')+'</div>'+
          '<div class="emeta">'+
            '<span class="badge bo" style="margin-right:5px">Onboarding</span>'+
            '<span class="badge '+(c.STATUS==='Pending'?'bo':c.STATUS==='Transferred'?'bg2':'bn')+'">'+esc(c.STATUS||'—')+'</span>'+
          '</div>'+
        '</div>'+
      '</div>'+
      '<div class="empdetail-grid">'+
        '<div class="empdetail-row"><div class="empdetail-label">OB ID</div><div class="empdetail-val">'+esc(c.OB_ID||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Position Type</div><div class="empdetail-val">'+esc(c.POSITION_TYPE||'—')+'</div></div>'+
        '<div class="empdetail-row full"><div class="empdetail-label">Full Name</div><div class="empdetail-val">'+esc(c.FULL_NAME||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Passport No</div><div class="empdetail-val" style="font-family:monospace;font-size:12px">'+esc(c.PASSPORT_NO||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Mobile</div><div class="empdetail-val">'+esc(c.MOBILE||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Visa Status</div><div class="empdetail-val">'+esc(c.VISA_STATUS||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Expected Join</div><div class="empdetail-val">'+fmtD(c.EXP_JOIN_DATE||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Date Added</div><div class="empdetail-val">'+fmtD(c.DATE_ADDED||'—')+'</div></div>'+
      '</div>';

    var editBtn = document.getElementById('empdetail-edit-btn');
    if(editBtn){
      editBtn.textContent = '\u270E Edit Candidate';
      editBtn.onclick = function(){
        closeM('m-empdetail');
        OBAgent.openEdit(obId);
      };
    }
    openM('m-empdetail');
  },

  show: function(){
    var q = (document.getElementById('gsearch-input')||{}).value||'';
    if(q.trim()) this._run(q);
  },

  hide: function(){
    var box = document.getElementById('gsearch-results'); if(!box) return;
    box.classList.remove('open');
    box.innerHTML = '';
  },

  clear: function(){
    var inp = document.getElementById('gsearch-input'); if(inp) inp.value='';
    var clr = document.getElementById('gsearch-clear'); if(clr) clr.style.display='none';
    this.hide();
    this._lastQ = '';
  }
};

// Close search on outside click
document.addEventListener('click', function(e){
  var wrap = document.getElementById('gsearch-wrap');
  if(wrap && !wrap.contains(e.target)) GlobalSearch.hide();

// Functions that don't require an auth token
var _PUBLIC_FNS = ['loginUser','validateSession','logoutUser','loadAllData',
                   'getPublicJobs','submitApplication','uploadCV'];

var GAS={
  call:function(fn,args,ok,err){
    function _onErr(e){
      var msg = e.message || String(e);
      if(msg === 'SESSION_EXPIRED' || msg.indexOf('Session expired') === 0){
        showLoginScreen('Your session has expired. Please log in again.');
        return;
      }
      if(msg.indexOf('ACCESS_DENIED') === 0) toast('Access denied: insufficient permissions','error');
      else toast('Server error: '+msg,'error');
      if(err) err(e);
    }
    if(_PUBLIC_FNS.indexOf(fn) >= 0){
      // Public functions called directly
      google.script.run
        .withSuccessHandler(function(r){ if(ok) ok(r); })
        .withFailureHandler(_onErr)
        [fn].apply(google.script.run, args||[]);
    } else {
      // All protected calls routed through runProtected with session token
      google.script.run
        .withSuccessHandler(function(r){
          if(r && r.error === 'SESSION_EXPIRED'){ showLoginScreen('Session expired. Please log in again.'); return; }
          if(ok) ok(r);
        })
        .withFailureHandler(_onErr)
        .runProtected(APP.token, fn, args||[]);
    }
  },
  loadAll:function(cb){
    google.script.run
      .withSuccessHandler(function(r){
        if(r.user)          APP.user       =r.user;
        if(r.master     &&r.master.success)     APP.master     =r.master.data     ||[];
        if(r.deletions  &&r.deletions.success)  APP.deletions  =r.deletions.data  ||[];
        if(r.onboarding &&r.onboarding.success) APP.onboarding =r.onboarding.data ||[];
        if(r.hrDocs     &&r.hrDocs.success)     APP.hrDocs     =r.hrDocs.data     ||[];
        if(r.summary    &&r.summary.success)    APP.summary    =r.summary.data    ||[];
        APP.config=r.config||{}; APP.loaded=true;
        if(cb) cb();
      })
      .withFailureHandler(function(e){ toast('Load error: '+(e.message||e),'error'); })
      .loadAllData(APP.token);
  },
  addEmployee:      function(d,cb){ GAS.call('addEmployee',     [d],cb); },

  issueHRDoc:       function(d,cb){ GAS.call('issueHRDoc',      [d],cb); },

  generateAndIssueLetter:function(d,cb)    { GAS.call('generateAndIssueLetter',[d],   cb); },
  // User management
  getUsers:              function(cb)    { GAS.call('getUsers',              [],    cb); },

// EMPLOYEE AGENT — lazy load 100/batch
// ============================================================
var EmpAgent={
  _pageSize:50, _masterPage:0, _activePage:0,
  _sort:{col:'NAME',dir:'asc'}, _sortActive:{col:'ID',dir:'desc'},
  _isMasterView:function(){
    var v=document.getElementById('view-masterdata'); return v&&v.classList.contains('active');
  },
  _filteredMaster:function(){
    var q  =(document.getElementById('emp-q')    ||{}).value||'';
    var qt =(document.getElementById('emp-tq')   ||{}).value||'';
    var ent=(document.getElementById('emp-ent')  ||{}).value||'';
    var lic=(document.getElementById('emp-lic')  ||{}).value||'';
    var sts=(document.getElementById('emp-sts')  ||{}).value||'';
    var nat=(document.getElementById('emp-nat-f')||{}).value||'';
    var doj=(document.getElementById('emp-doj-f')||{}).value||'';
    q=q.toLowerCase(); qt=qt.toLowerCase();
    var list=APP.master.filter(function(r){
      if(q  && ![(r.NAME||''),(r.ID||''),(r['PASSPORT NO']||'')].some(function(v){ return v.toLowerCase().indexOf(q)>=0; })) return false;
      if(qt && ![(r.NAME||''),(r.ID||''),(r['EID NO']||'')].some(function(v){ return v.toLowerCase().indexOf(qt)>=0; })) return false;
      if(ent && normEnt(r.ENTITY)!==ent) return false;
      if(lic && r['LIC AUTH']!==lic) return false;
      if(sts && r.STATUS!==sts) return false;
      if(nat && (r.NATIONALITY||'').toLowerCase().indexOf(nat.toLowerCase())<0) return false;
      if(doj && (r['DATE OF JOIN']||'').indexOf(doj)<0) return false;
      return true;
    });
    var sc=this._sort.col, sd=this._sort.dir;
    list.sort(function(a,b){ var av=String(a[sc]||'').toUpperCase(),bv=String(b[sc]||'').toUpperCase(); return sd==='asc'?av.localeCompare(bv):bv.localeCompare(av); });
    return list;
  },
  _filteredActive:function(){
    var q  =(document.getElementById('emp-q2')||{}).value||'';
    var ents=MultiSel.get('ms-emp-ent2');
    var lics=MultiSel.get('ms-emp-lic2');
    q=q.toLowerCase();
    var list=getActiveEmployees().filter(function(r){
      if(q && ![(r.NAME||''),(r.ID||''),(r['PASSPORT NO']||'')].some(function(v){ return v.toLowerCase().indexOf(q)>=0; })) return false;
      if(ents.length && ents.indexOf(normEnt(r.ENTITY))===-1) return false;
      if(lics.length && lics.indexOf(r['LIC AUTH'])===-1) return false;
      return true;
    });
    var sc=this._sortActive.col, sd=this._sortActive.dir;
    list.sort(function(a,b){
      if(sc==='ID'){ var ai=parseInt(a.ID,10)||0,bi=parseInt(b.ID,10)||0; return sd==='asc'?ai-bi:bi-ai; }
      var av=String(a[sc]||'').toUpperCase(),bv=String(b[sc]||'').toUpperCase();
      return sd==='asc'?av.localeCompare(bv):bv.localeCompare(av);
    });
    return list;
  },
  render:function(reset){
    var self=this;
    var licB=function(l){ var m={PSBD:'bp',SIRA:'bs',NIL:'bn',OTHER:'bo'}; return '<span class="badge '+(m[l]||'bn')+'">'+esc(l||'NIL')+'</span>'; };
    var entB=function(e){ var en=normEnt(e)||'—'; var m={USG:'bp',UG:'bs',UST:'bo','USG-M':'bn'}; return '<span class="badge '+(m[en]||'bn')+'">'+esc(en)+'</span>'; };
    // Master table row (6 cols)

      var id=esc(r.ID||''), nm=esc(r.NAME||'—');
      return '<tr>'+
        '<td style="color:var(--muted2);font-size:10px">'+(i+1)+'</td>'+
        '<td><span class="pph" title="PP: '+esc(r['PASSPORT NO']||'N/A')+'">'+id+'</span></td>'+

        '<td><div class="act-btns">'+
          '<button class="btn btn-secondary btn-icon btn-sm" data-action="view-emp" data-id="'+id+'" title="View Details">&#128100;</button>'+
          '<button class="btn btn-secondary btn-icon btn-sm" data-action="edit-emp" data-id="'+id+'" title="Edit">&#9998;</button>'+
          '<button class="btn btn-danger btn-icon btn-sm" data-action="del-emp" data-id="'+id+'" data-name="'+nm+'" title="Delete">&#128465;</button>'+
        '</div></td></tr>';
    };
    // Active table row (9 cols)
    var makeActiveRow=function(r,i){
      var id=esc(r.ID||''), nm=esc(r.NAME||'—');
      return '<tr>'+
        '<td style="color:var(--muted2);font-size:10px">'+(i+1)+'</td>'+
        '<td style="font-family:monospace;font-size:11.5px;font-weight:600;color:var(--navy)">'+id+'</td>'+
        '<td style="font-weight:600">'+nm.substring(0,26)+(nm.length>26?'&hellip;':'')+'</td>'+
        '<td style="font-size:11.5px;color:var(--muted)">'+esc(r.DESIGNATION||'—')+'</td>'+
        '<td style="font-size:11.5px">'+esc(fmtD(r['DATE OF JOIN']||'—'))+'</td>'+
        '<td>'+entB(r.ENTITY)+'</td>'+
        '<td>'+licB(r['LIC AUTH']||'NIL')+'</td>'+
        '<td class="eid-cell" id="eid-cell2-'+id+'"><span style="font-family:monospace;font-size:11px">'+esc(r['EID NO']||'—')+'</span></td>'+
        '<td><div class="act-btns">'+
          '<button class="btn btn-secondary btn-icon btn-sm" data-action="view-emp" data-id="'+id+'" title="View Details">&#128100;</button>'+
          '<button class="btn btn-secondary btn-icon btn-sm" data-action="edit-emp" data-id="'+id+'" title="Edit">&#9998;</button>'+
          '<button class="btn btn-danger btn-icon btn-sm" data-action="del-emp" data-id="'+id+'" data-name="'+nm+'" title="Delete">&#128465;</button>'+
        '</div></td></tr>';
    };
    var emptyM='<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--muted)">No records found.</td></tr>';
    var emptyA='<tr><td colspan="9" style="text-align:center;padding:32px;color:var(--muted)">No records found.</td></tr>';
    var active=getActiveEmployees();
    var nb=document.getElementById('nb-emp'); if(nb) nb.textContent=active.length;
    if(reset){ this._masterPage=0; this._activePage=0; }

    // — Master Data: paginated —
    var tb=document.getElementById('emp-tbody');
    if(tb){
      var mlist=this._filteredMaster(), mt=mlist.length;
      var cnt=document.getElementById('emp-cnt'); if(cnt) cnt.textContent=mt+' of '+APP.master.length;
      var mp=this._masterPage, ps=this._pageSize;
      mp=Math.min(mp, mt>0?Math.ceil(mt/ps)-1:0); this._masterPage=mp;
      var mSlice=mlist.slice(mp*ps,(mp+1)*ps);
      tb.innerHTML=mt?mSlice.map(function(r,i){ return makeRow(r,mp*ps+i); }).join(''):emptyM;
      self._renderPagination(mt,mp,ps,'emp-pgn','master');
    }

    // — Active Employees: paginated —
    var tb2=document.getElementById('emp-tbody2');
    if(tb2){
      var alist=this._filteredActive(), at=alist.length;
      var cnt2=document.getElementById('emp-cnt2'); if(cnt2) cnt2.textContent=at+' of '+active.length;
      var ap=this._activePage, ps2=this._pageSize;
      ap=Math.min(ap, at>0?Math.ceil(at/ps2)-1:0); this._activePage=ap;
      var aSlice=alist.slice(ap*ps2,(ap+1)*ps2);
      tb2.innerHTML=at?aSlice.map(function(r,i){ return makeActiveRow(r,ap*ps2+i); }).join(''):emptyA;
      self._renderPagination(at,ap,ps2,'emp-pgn2','active');
    }
  },
  goPage:function(table,page){
    if(table==='master') this._masterPage=page;
    else this._activePage=page;
    this.render(false);
  },
  sortByActive:function(col){
    if(this._sortActive.col===col) this._sortActive.dir=this._sortActive.dir==='asc'?'desc':'asc';
    else{ this._sortActive.col=col; this._sortActive.dir=col==='ID'?'desc':'asc'; }
    this._activePage=0;
    this.render(false);
  },
  _renderPagination:function(total,page,pageSize,pgnId,table){
    var pgn=document.getElementById(pgnId); if(!pgn) return;
    if(total<=pageSize){ pgn.innerHTML=''; return; }
    var totalPages=Math.ceil(total/pageSize);
    var from=page*pageSize+1, to=Math.min((page+1)*pageSize,total);
    var btn=function(p,label,active,disabled){
      return '<button class="pgbtn'+(active?' active':'')+(disabled?' disabled':'')+'" '+(disabled?'disabled':'')+' onclick="EmpAgent.goPage(\''+table+'\','+p+')">'+label+'</button>';
    };
    var html=btn(page-1,'&#8592;',false,page===0);
    // build page list with ellipsis
    var pages=[];
    if(totalPages<=7){ for(var i=0;i<totalPages;i++) pages.push(i); }
    else{
      pages=[0];
      if(page>3) pages.push(-1);
      for(var i=Math.max(1,page-2);i<=Math.min(totalPages-2,page+2);i++) pages.push(i);
      if(page<totalPages-4) pages.push(-1);
      pages.push(totalPages-1);
    }
    pages.forEach(function(p){
      html+= p===-1
        ? '<span style="padding:0 3px;color:var(--muted2);line-height:28px">…</span>'
        : btn(p,p+1,p===page,false);
    });
    html+='<span style="font-size:11px;color:var(--muted);padding:0 8px;white-space:nowrap">'+from+'–'+to+' / '+total+'</span>';
    html+=btn(page+1,'&#8594;',false,page===totalPages-1);
    pgn.innerHTML=html;
  },
  sortBy:function(col){
    if(this._sort.col===col) this._sort.dir=this._sort.dir==='asc'?'desc':'asc';
    else{ this._sort.col=col; this._sort.dir='asc'; }
    // update sort indicators
    document.querySelectorAll('.sort-btn').forEach(function(b){ b.classList.remove('active'); b.textContent='&#8597;'; });
    var btn=document.querySelector('.sort-btn[data-col="'+col+'"]');
    if(btn){ btn.classList.add('active'); btn.innerHTML=this._sort.dir==='asc'?'&#8593;':'&#8595;'; }
    this.render(true);
  },
  resetF:function(){

    this.render(true);
  },

  save:function(){
    var editId=document.getElementById('ef-editid').value;
    var id   =document.getElementById('ef-id').value.trim();
    var name =document.getElementById('ef-name').value.trim();
    var pp   =document.getElementById('ef-pp').value.trim();
    var eid  =document.getElementById('ef-eid').value.trim();
    if(!id)  { toast('Employee ID required','error'); return; }
    if(!name){ toast('Full Name required','error'); return; }
    if(!pp)  { toast('Passport No required','error'); return; }
    if(eid&&!eid.startsWith('784')){ toast('EID must start with 784','error'); return; }
    if(!editId&&APP.master.some(function(e){ return e.ID===id; })){ toast('Employee ID exists','error'); return; }
    if(!editId&&APP.master.some(function(e){ return e['PASSPORT NO']===pp; })){ toast('Passport No exists','error'); return; }
    var loc=document.getElementById('ef-loc').value;
    var empEmail=(document.getElementById('ef-email')||{}).value||'';
    var data={ID:id,NAME:name.toUpperCase(),VISA:loc,STATUS:loc,ENTITY:document.getElementById('ef-ent').value,'LIC AUTH':document.getElementById('ef-lic').value,DESIGNATION:document.getElementById('ef-desig').value.trim()||'Security Guard','DATE OF JOIN':document.getElementById('ef-join').value,NATIONALITY:document.getElementById('ef-nat').value.trim().toUpperCase(),'BIRTH DATE':document.getElementById('ef-birth').value,'PASSPORT NO':pp.toUpperCase(),'EID NO':eid,AGE:'',Days:document.getElementById('ef-days').value||'0',EMAIL:empEmail.toLowerCase().trim()};
    var btn=document.querySelector('#m-emp .btn-gold'); if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin-sm"></span> Saving&hellip;'; }
    var done=function(result){
      if(btn){ btn.disabled=false; btn.textContent='Save Employee'; }
      if(!result||!result.success){ toast('Error: '+(result?result.error:'Unknown'),'error'); return; }
      if(editId){ var idx=APP.master.findIndex(function(e){ return e.ID===editId; }); if(idx>=0) APP.master[idx]=data; toast('Updated: '+name,'success'); }
      else{ APP.master.push(data); toast('Added: '+name,'success'); }
      closeM('m-emp'); EmpAgent.render(true); DashAgent.refresh();
    };
    editId?GAS.updateEmployee(data,done):GAS.addEmployee(data,done);
  },
  openDelete:function(id,name){

// ONBOARDING AGENT — real-time bind, correct workflow

  openEdit:function(obId){

    if(!c){ toast('Not found','error'); return; }
    document.getElementById('m-ob-ttl').textContent='Edit Candidate';
    document.getElementById('obf-editid').value=obId;
    document.getElementById('obf-name').value  =c.FULL_NAME||'';

  // STEP 2: Save to Onboarding Sheet
  save:function(){
    var editId=document.getElementById('obf-editid').value;
    var name  =document.getElementById('obf-name').value.trim();
    var pp    =document.getElementById('obf-pp').value.trim();
    if(!name){ toast('Full Name required','error'); return; }
    if(!pp)  { toast('Passport No required','error'); return; }
    if(!editId&&APP.onboarding.some(function(c){ return c.PASSPORT_NO===pp&&c.STATUS!=='Cancelled'; })){ toast('Candidate already exists','error'); return; }
    if(!editId&&APP.master.some(function(e){ return e['PASSPORT NO']===pp; })){ toast('Passport No in Master Data','error'); return; }
    var type =document.getElementById('obf-type').value;
    var mob  =document.getElementById('obf-mob').value.trim();
    var visa =document.getElementById('obf-visa').value;
    var join =document.getElementById('obf-join').value;
    var notes=document.getElementById('obf-notes').value.trim();
    if(editId){
      var data={OB_ID:editId,FULL_NAME:name.toUpperCase(),PASSPORT_NO:pp.toUpperCase(),POSITION_TYPE:type,MOBILE:mob,VISA_STATUS:visa,EXP_JOIN_DATE:join,DATE_ADDED:'',STATUS:'Pending',NOTES:notes};
      GAS.updateOnboarding(data,function(result){
        if(!result||!result.success){ toast('Error: '+(result?result.error:'Unknown'),'error'); return; }
        var c=APP.onboarding.find(function(r){ return r.OB_ID===editId; });
        if(c) Object.assign(c,data);
        toast('Updated: '+name,'success');
        closeM('m-ob'); OBAgent.render();
      });
    } else {
      var obId=genId('OB');
      var newRec={OB_ID:obId,FULL_NAME:name.toUpperCase(),PASSPORT_NO:pp.toUpperCase(),POSITION_TYPE:type,MOBILE:mob,VISA_STATUS:visa,EXP_JOIN_DATE:join,DATE_ADDED:today(),STATUS:'Pending',NOTES:notes,ASSIGNED_TO:(APP.user&&APP.user.name)||''};
      GAS.addOnboarding(newRec,function(result){
        if(!result||!result.success){ toast('Error: '+(result?result.error:'Unknown'),'error'); return; }
        APP.onboarding.push(newRec); // real-time bind
        closeM('m-ob'); OBAgent.render();
        setTimeout(function(){
          toastAction('Candidate added. Generate Offer Letter now?','Generate',function(){ OBAgent._openOLForCandidate(newRec); });
        },300);
      });

  },
  // STEP 3: Offer letter from existing candidate data
  _openOLForCandidate:function(cand){
    document.getElementById('ol-name').value=(cand.FULL_NAME||'').toUpperCase();
    document.getElementById('ol-pp').value  =(cand.PASSPORT_NO||'').toUpperCase();
    document.getElementById('ol-date').textContent=todayDisplay();
    document.getElementById('ol-msg').textContent='';
    selectOL(cand.POSITION_TYPE||'PSBD');
    openM('m-ol');
  },
  openOLForId:function(obId,name,type,pp){
    var cand={FULL_NAME:name,PASSPORT_NO:pp,POSITION_TYPE:type};
    this._openOLForCandidate(cand);
  },
  openTransfer:function(obId,name){
    document.getElementById('trf-obid').value=obId;
    document.getElementById('tr-name').textContent=name;
    // Auto-generate next sequential Employee ID
    var nums=(APP.master||[]).map(function(r){ return parseInt(r.ID,10); }).filter(function(n){ return !isNaN(n); });
    var nextId=nums.length?(Math.max.apply(null,nums)+1):1001;
    var idEl=document.getElementById('trf-id');
    idEl.value=String(nextId);
    document.getElementById('trf-ent').value  ='USG';
    document.getElementById('trf-join').value =today();
    document.getElementById('trf-desig').value='Security Guard';
    openM('m-tr');
  },
  confirmTransfer:function(){
    var obId =document.getElementById('trf-obid').value;
    var empId=document.getElementById('trf-id').value.trim();
    var ent  =document.getElementById('trf-ent').value;
    var join =document.getElementById('trf-join').value;
    var desig=document.getElementById('trf-desig').value.trim()||'Security Guard';
    if(!empId){ toast('Employee ID required','error'); return; }
    if(!ent)  { toast('Entity required','error'); return; }
    if(APP.master.some(function(e){ return e.ID===empId; })){ toast('Employee ID already exists','error'); return; }
    var cand=APP.onboarding.find(function(c){ return c.OB_ID===obId; });
    if(!cand){ toast('Candidate not found','error'); return; }
    var empData={ID:empId,NAME:cand.FULL_NAME,VISA:'ABU DHABI',STATUS:'ABU DHABI',ENTITY:ent,'LIC AUTH':cand.POSITION_TYPE==='PSBD'?'PSBD':'SIRA',DESIGNATION:desig,'DATE OF JOIN':join,NATIONALITY:'','BIRTH DATE':'','PASSPORT NO':cand.PASSPORT_NO,'EID NO':'',AGE:'',Days:''};
    GAS.transferToMaster(obId,empData,function(result){
      if(!result||!result.success){ toast('Error: '+(result?result.error:'Unknown'),'error'); return; }
      APP.master.push(empData);
      cand.STATUS='Transferred';
      toast('Transferred: '+cand.FULL_NAME,'success');
      closeM('m-tr'); OBAgent.render(); EmpAgent.render(true); DashAgent.refresh();
    });
  },
  cancel:function(obId){
    var c=APP.onboarding.find(function(r){ return r.OB_ID===obId; }); if(!c) return;
    if(!confirm('Cancel onboarding for '+c.FULL_NAME+'?')) return;
    var data=Object.assign({},c,{STATUS:'Cancelled'});
    GAS.updateOnboarding(data,function(result){
      if(!result||!result.success){ toast('Error','error'); return; }
      c.STATUS='Cancelled';
      toast(c.FULL_NAME+' cancelled','info');
      OBAgent.render();
    });
  }
};

  openIssue:function(){
    ['ltf-empid','ltf-name','ltf-des','ltf-pp','ltf-entity','ltf-doj','ltf-sal','ltf-bank','ltf-addr','ltf-notes'].forEach(function(id){ var el=document.getElementById(id); if(el) el.value=''; });

    var type=document.getElementById('ltf-type').value;
    var ef=document.getElementById('ltf-empid');
    ef.disabled=!type; ef.placeholder=type?'Enter Employee ID':'Select letter type first';
    if(!type){

      ['ltf-name','ltf-des','ltf-pp','ltf-entity','ltf-doj'].forEach(function(id){ var el=document.getElementById(id); if(el) el.value=''; });
    }
    var isSalCert=(type==='Salary Certificate');
    var salRow=document.getElementById('ltf-sal-row'); if(salRow) salRow.style.display=isSalCert?'':'none';
    var bankRow=document.getElementById('ltf-bank-row'); if(bankRow) bankRow.style.display=isSalCert?'':'none';
    var addrRow=document.getElementById('ltf-addr-row'); if(addrRow) addrRow.style.display=isSalCert?'':'none';
    var key=type?type.toUpperCase().replace(/[^A-Z0-9]/g,'_'):'';
    var hasTemplate=!!(key&&(APP.config['LTEMPL_'+key+'_DRIVE']||APP.config['LTEMPL_'+key+'_BODY']));
    var warn=document.getElementById('ltf-no-tmpl-warn'); if(warn) warn.style.display=(type&&!hasTemplate)?'':'none';
    var ok=document.getElementById('ltf-tmpl-ok'); if(ok) ok.style.display=(type&&hasTemplate)?'':'none';
    var btn=document.getElementById('ltf-gen-btn');
    if(btn) btn.textContent=hasTemplate?'Generate Letter':'Issue (No PDF)';
  },
  autofill:function(){
    var id=document.getElementById('ltf-empid').value.trim();
    var emp=getActiveEmployees().find(function(e){ return e.ID===id; });
    var set=function(elId,val){ var el=document.getElementById(elId); if(el) el.value=val||''; };
    if(emp){
      set('ltf-name',   emp.NAME||'');
      set('ltf-des',    emp['DESIGNATION']||'');
      set('ltf-pp',     emp['PASSPORT NO']||'');
      set('ltf-entity', emp.ENTITY||'');
      set('ltf-doj',    emp['DATE OF JOIN']||'');
    } else {
      set('ltf-name',   id?'(not found)':'');
      set('ltf-des',''); set('ltf-pp',''); set('ltf-entity',''); set('ltf-doj','');
    }
  },
  issue:function(){
    var type =document.getElementById('ltf-type').value;
    var empId=document.getElementById('ltf-empid').value.trim();
    if(!type)  { toast('Select letter type first','error'); return; }
    if(!empId) { toast('Employee ID required','error'); return; }
    if(type==='Salary Certificate'){
      if(!document.getElementById('ltf-sal').value.trim()){ toast('Monthly Salary required','error'); return; }
      if(!document.getElementById('ltf-bank').value.trim()){ toast('Bank Name required','error'); return; }
      if(!document.getElementById('ltf-addr').value.trim()){ toast('Address required','error'); return; }
    }
    var get=function(id){ var el=document.getElementById(id); return el?el.value.trim():''; };
    var ref='HR-'+Date.now().toString().slice(-8);
    var data={
      REF_NO:      ref,
      EMP_ID:      empId,
      EMP_NAME:    get('ltf-name'),
      LETTER_TYPE: type,
      ISSUE_DATE:  get('ltf-date'),
      ISSUED_BY:   get('ltf-by'),
      NOTES:       get('ltf-notes'),
      SALARY:      get('ltf-sal'),
      BANK_NAME:   get('ltf-bank'),
      ADDRESS:     get('ltf-addr'),
      DESIGNATION: get('ltf-des'),
      PASSPORT_NO: get('ltf-pp'),
      ENTITY:      get('ltf-entity'),
      DATE_OF_JOIN:get('ltf-doj')
    };
    var key=type.toUpperCase().replace(/[^A-Z0-9]/g,'_');
    var hasTemplate=!!(APP.config['LTEMPL_'+key+'_DRIVE']||APP.config['LTEMPL_'+key+'_BODY']);
    var btn=document.getElementById('ltf-gen-btn');
    if(btn){ btn.disabled=true; btn.textContent='Generating…'; }
    GAS.generateAndIssueLetter(data,function(result){
      if(btn){ btn.disabled=false; btn.textContent=hasTemplate?'Generate Letter':'Issue (No PDF)'; }
      if(!result||!result.success){ toast('Error: '+(result?result.error:'Unknown'),'error'); return; }
      APP.hrDocs.unshift({REF_NO:ref,EMP_ID:empId,EMP_NAME:data.EMP_NAME,LETTER_TYPE:type,ISSUE_DATE:data.ISSUE_DATE,ISSUED_BY:data.ISSUED_BY,NOTES:data.NOTES});
      closeM('m-ltr'); LtrAgent.render();
      if(result.pdf){
        var fname = type.replace(/\s+/g,'-')+'_'+empId+'_'+ref+'.pdf';
        try {
          var bytes = new Uint8Array(atob(result.pdf).split('').map(function(c){ return c.charCodeAt(0); }));
          _openPdfResult(URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})), fname);
        } catch(e) { toast('Error opening PDF: '+e.message,'error'); }
      } else {
        toast(type+' issued ('+ref+') — no PDF template configured','info');
      }
    });
  },
  delEntry:function(ref){ APP.hrDocs=APP.hrDocs.filter(function(l){ return l.REF_NO!==ref; }); toast('Removed locally','warning'); this.render(); },

    });
    if(!items.length){ toast('No employees selected','error'); return; }

      if(idx >= items.length){
        if(!collectedPdfs.length){ toast('No PDFs generated','error'); if(btn) btn.disabled=false; return; }

        var mFile = 'Experience_Letters_'+collectedPdfs.length+'_employees.pdf';
        _mergeBulkExpPdfs(collectedPdfs, function(url){
          _openPdfResult(url, mFile);
          if(btn){ btn.disabled=false; btn.style.display='none'; }
          var sa=document.getElementById('exp-sel-all'); if(sa) sa.checked=false;
          GAS.call('getHRDocs',[],function(dr){
            if(dr&&dr.success){ APP.hrDocs=dr.data||[]; LtrAgent.render(); LtrAgent.renderExpPanel(); }
          });
        });
        return;
      }
      var item = items[idx++];
      toast('('+(idx)+'/'+items.length+') '+esc(item.name)+'…','info');
      genExpLetter(item.id, item.name, function(pdf){ if(pdf) collectedPdfs.push(pdf); next(); });
    }
    next();
  }
};

var ExcelAgent={
  _MONTHS:['January','February','March','April','May','June','July','August','September','October','November','December'],
  _MONTHS_SHORT:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],

  // Called when navigating to Active Employees view — populates dynamic dropdowns
  populateFilters:function(){
    var active=getActiveEmployees();

    // Joining years — extracted from DATE OF JOIN
    // Joining years — build multi-select options
    var years={};
    active.forEach(function(r){
      var m=String(r['DATE OF JOIN']||'').match(/(\d{4})/);
      if(m) years[m[1]]=true;
    });
    MultiSel.build('ms-xls-year-drop', Object.keys(years).sort().reverse().map(function(y){ return {value:y,label:y}; }), 'ms-xls-year');

    // Designations — build multi-select options
    var desigs={};
    active.forEach(function(r){
      var d=String(r.DESIGNATION||'').trim();
      if(d&&d!=='Unknown'&&d!=='nan') desigs[d]=true;
    });
    MultiSel.build('ms-xls-desig-drop', Object.keys(desigs).sort().map(function(d){ return {value:d,label:d}; }), 'ms-xls-desig');
  },

  // Parse month number (1–12) from any date string
  _month:function(s){
    if(!s||s==='—') return null;
    var m=String(s).match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if(m) return parseInt(m[2],10);
    m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);        if(m) return parseInt(m[2],10);
    var d=new Date(s); if(!isNaN(d)) return d.getMonth()+1;
    return null;
  },

  // Parse 4-digit year from any date string
  _year:function(s){
    var m=String(s||'').match(/(\d{4})/); return m?m[1]:null;
  },

  export:function(){
    if(typeof XLSX==='undefined'){ toast('Excel library still loading — please retry in a moment.','error'); return; }

    var bms =MultiSel.get('ms-xls-birth').map(function(v){ return parseInt(v,10); });
    var jys =MultiSel.get('ms-xls-year');
    var dess=MultiSel.get('ms-xls-desig');
    var orgs=MultiSel.get('ms-xls-org');

    // Begin with the same filtered list used by the active table
    var list=EmpAgent._filteredActive();

    // Apply multi-select export filters — each filter: if any selected, record must match one of them
    if(bms.length)  list=list.filter(function(r){ return bms.indexOf(ExcelAgent._month(r['BIRTH DATE']||''))!==-1; });
    if(jys.length)  list=list.filter(function(r){ return jys.indexOf(ExcelAgent._year(r['DATE OF JOIN']||''))!==-1; });
    if(dess.length) list=list.filter(function(r){ return dess.indexOf(String(r.DESIGNATION||'').trim())!==-1; });
    if(orgs.length) list=list.filter(function(r){ return orgs.indexOf(normEnt(r.ENTITY))!==-1; });

    if(!list.length){ toast('No records match the selected filters.','error'); return; }

    // Full column set from master sheet
    var COLS=[
      {h:'Emp ID',          k:'ID'},
      {h:'Full Name',       k:'NAME'},
      {h:'Designation',     k:'DESIGNATION'},
      {h:'Date of Joining', k:'DATE OF JOIN',  fmt:true},
      {h:'Date of Birth',   k:'BIRTH DATE',    fmt:true},
      {h:'Age',             k:'AGE'},
      {h:'Nationality',     k:'NATIONALITY'},
      {h:'Organization',    k:'ENTITY',        norm:true},
      {h:'License Auth',    k:'LIC AUTH'},
      {h:'Location / Visa', k:'STATUS'},
      {h:'Passport No',     k:'PASSPORT NO'},
      {h:'Emirates ID',     k:'EID NO'},
      {h:'Email',           k:'EMAIL'},
      {h:'Days of Service', k:'Days'},
      {h:'Visa',            k:'VISA'}
    ];

    var headers=COLS.map(function(c){ return c.h; });
    var rows=list.map(function(r){
      return COLS.map(function(c){
        var v=r[c.k]!=null?String(r[c.k]):'';
        if(c.fmt&&v) v=fmtD(v);
        if(c.norm&&v) v=normEnt(v)||v;
        return v;
      });
    });

    var wb=XLSX.utils.book_new();
    var ws=XLSX.utils.aoa_to_sheet([headers].concat(rows));
    ws['!cols']=[
      {wch:10},{wch:28},{wch:24},{wch:14},{wch:14},
      {wch:6},{wch:14},{wch:10},{wch:12},{wch:14},
      {wch:14},{wch:20},{wch:28},{wch:8},{wch:14}
    ];
    ws['!freeze']={xSplit:0,ySplit:1,topLeftCell:'A2',activeCell:'A2',sqref:'A2'};
    XLSX.utils.book_append_sheet(wb,ws,'Active Manpower');

    // Build descriptive filename
    var parts=['Active_Manpower'];
    if(orgs.length)  parts.push(orgs.join('-'));
    if(bms.length)   parts.push('Birth_'+bms.map(function(n){ return ExcelAgent._MONTHS_SHORT[n-1]; }).join('-'));
    if(jys.length)   parts.push('Join_'+jys.join('-'));
    if(dess.length===1) parts.push(dess[0].replace(/[^a-zA-Z0-9]/g,'_').substring(0,18));
    parts.push(new Date().toISOString().split('T')[0]);
    var filename=parts.join('_')+'.xlsx';

    var out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    var blob=new Blob([out],{type:'application/octet-stream'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=url; a.download=filename; a.click();
    URL.revokeObjectURL(url);

    toast(list.length.toLocaleString()+' records exported \u2192 '+filename,'success');
  }
};

//   POS   → x=144.860  y=699.880  Helvetica Bold    10.020pt
//   PP NO → x=376.000  y=699.880  Helvetica Bold    10.020pt
//   (y is pdf-lib bottom-left: y_pdflib = 841.92 - y_mupdf)
// ============================================================
var olType = 'PSBD';
var OL_CACHE = {}; // {PSBD: base64str, SIRA: base64str}

function selectOL(t){
  olType = t;
  document.getElementById('ol-psbd').className = 'type-card'+(t==='PSBD'?' active-psbd':'');
  document.getElementById('ol-sira').className = 'type-card'+(t==='SIRA'?' active-sira':'');
  document.getElementById('ol-pos').textContent = t==='PSBD'?'SECURITY GUARD':'SECURITY GUARD - SIRA';
  var btn = document.getElementById('ol-btn');
  btn.className = t==='PSBD'?'btn btn-gold':'btn btn-primary';
  btn.textContent = 'Download '+t+' Offer Letter';
}

function openOLModal(){
  document.getElementById('ol-name').value = '';
  document.getElementById('ol-pp').value   = '';
  document.getElementById('ol-date').textContent = todayDisplay();
  document.getElementById('ol-msg').textContent  = '';
  selectOL('PSBD');
  openM('m-ol');
}

function downloadOL(){
  var name = document.getElementById('ol-name').value.trim();
  var pp   = document.getElementById('ol-pp').value.trim();
  var msg  = document.getElementById('ol-msg');
  if(!name){ msg.style.color='var(--red)'; msg.textContent='Enter full name.'; return; }
  if(!pp)  { msg.style.color='var(--red)'; msg.textContent='Enter passport number.'; return; }

  var btn = document.getElementById('ol-btn');
  btn.disabled = true;
  msg.style.color = 'var(--teal)';

  // DD/MM/YYYY
  var now = new Date();
  var dateStr = ('0'+now.getDate()).slice(-2)+'/'+('0'+(now.getMonth()+1)).slice(-2)+'/'+now.getFullYear();

  // Use cache if available — instant
  if(OL_CACHE[olType]){
    msg.textContent = 'Generating...';
    btn.textContent = 'Generating...';
    _fillAndDownload(OL_CACHE[olType], name, pp, dateStr, msg, btn);
    return;
  }

  // Fetch from GAS (embedded in OfferLetterHelper.gs — very fast, no Drive latency)
  msg.textContent = 'Loading template...';
  btn.innerHTML   = '<span class="spin-sm"></span> Loading...';

  GAS.call('getOfferLetterTemplate', [olType], function(result){
    if(!result || !result.success){
      btn.disabled = false; btn.textContent = 'Download '+olType+' Offer Letter';
      msg.style.color = 'var(--red)';
      msg.textContent = 'Error: '+(result ? result.error : 'Could not load template');
      return;
    }
    OL_CACHE[olType] = result.data; // cache for instant re-use
    msg.textContent  = 'Filling fields...';
    btn.textContent  = 'Filling fields...';
    _fillAndDownload(result.data, name, pp, dateStr, msg, btn);
  });
}

// ============================================================
// FILL TEMPLATE — pdf-lib overlays 4 fields on USG template
// ============================================================
function _fillAndDownload(templateB64, name, pp, dateStr, msg, btn){
  // base64 → Uint8Array
  var binary = atob(templateB64);
  var bytes  = new Uint8Array(binary.length);
  for(var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

  PDFLib.PDFDocument.load(bytes).then(function(pdfDoc){
    var page = pdfDoc.getPages()[0];

    return Promise.all([
      pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold),
      pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica)
    ]).then(function(fonts){
      var fBold = fonts[0];
      var fReg  = fonts[1];
      var black = PDFLib.rgb(0, 0, 0);
      var SZ    = 10.020; // matches Tahoma 10.020pt in original

      // ── POSITION label (SIRA adds "- SIRA" suffix) ──
      var posText = (olType === 'SIRA') ? 'SECURITY GUARD - SIRA' : 'SECURITY GUARD';

      // DATE  → Helvetica Regular, x=453.520, y=733.740
      page.drawText(dateStr, {
        x: 453.520, y: 733.740, size: SZ, font: fReg, color: black
      });

      // NAME  → Helvetica Bold,    x=144.860, y=715.120
      page.drawText(name.toUpperCase(), {
        x: 144.860, y: 715.120, size: SZ, font: fBold, color: black
      });

      // POS   → Helvetica Bold,    x=144.860, y=699.880
      page.drawText(posText, {
        x: 144.860, y: 699.880, size: SZ, font: fBold, color: black
      });

      // PP NO → Helvetica Bold,    x=376.000, y=699.880
      page.drawText(pp.toUpperCase(), {
        x: 376.000, y: 699.880, size: SZ, font: fBold, color: black
      });

      return pdfDoc.save();
    });

  }).then(function(outBytes){
    var blob = new Blob([outBytes], {type:'application/pdf'});
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href   = url;
    a.download = 'OfferLetter_' + olType + '_' + name.replace(/\s+/g,'_') + '.pdf';
    a.click();
    URL.revokeObjectURL(url);

    btn.disabled = false;
    btn.textContent = 'Download ' + olType + ' Offer Letter';
    msg.textContent = 'Downloaded successfully!';
    Logger.write('OfferLetterAgent', 'GENERATE', olType + ' | ' + name + ' | ' + pp);

    // Log to HR Docs locally
    APP.hrDocs.unshift({
      REF_NO: 'OL-'+Date.now().toString().slice(-8),
      EMP_ID: 'ONBOARD', EMP_NAME: name,
      LETTER_TYPE: 'Offer Letter', ISSUE_DATE: today(),
      ISSUED_BY: APP.config.hr_officer||'HR',
      NOTES: olType + ' | PP: ' + pp
    });

  }).catch(function(e){
    btn.disabled = false;
    btn.textContent = 'Download ' + olType + ' Offer Letter';
    msg.style.color = 'var(--red)';
    msg.textContent = 'PDF Error: ' + e.message;
    console.error('Offer letter error:', e);
  });
}

var AgentManager={
  _lastSync:null, _timerInterval:null,

  init:function(){
    var self=this;
    this._months();
    this._showLoader(true);
    this._startTimer();
    // 15 MINUTE auto-refresh — skip if editing
    setInterval(function(){
      if(EDITING){ return; }
      self.refreshAll();
    }, 15*60*1000);
    GAS.loadAll(function(){
      self._showLoader(false);
      self._lastSync=Date.now();
      var role = APP.user ? APP.user.role : 'NONE';
      if(!APP.user || role === 'NONE') {
        showAccessDenied();
        return;
      }
      if(role === 'EMPLOYEE') {
        showSelfServicePortal();
        return;
      }
      renderNav();
      EmpAgent.render(true);
      OBAgent.render();
      LtrAgent.render();
      DashAgent.refresh();
      CFG.loadUI();
      var sl=document.getElementById('sync-label');
      if(sl) sl.textContent='Data Synced via Google';
      toast('Dashboard loaded - '+getActiveEmployees().length.toLocaleString()+' active employees','success');
    });
  },

  _startTimer:function(){
    var self=this;
    if(this._timerInterval) clearInterval(this._timerInterval);
    this._timerInterval=setInterval(function(){
      if(!self._lastSync) return;
      var elapsed=Math.floor((Date.now()-self._lastSync)/1000);
      var m=Math.floor(elapsed/60), s=elapsed%60;
      var display=m>0?m+'m '+String(s).padStart(2,'0')+'s ago':String(s).padStart(2,'0')+'s ago';
      var el=document.getElementById('sync-timer'); if(el) el.textContent=display;
    },1000);
  },

  refreshAll:function(){
    var self=this;
    var sl=document.getElementById('sync-label'); if(sl) sl.textContent='Syncing...';
    GAS.loadAll(function(){
      self._lastSync=Date.now();
      var role = APP.user ? APP.user.role : 'NONE';
      if(role !== 'NONE' && role !== 'EMPLOYEE') {
        EmpAgent.render(true); OBAgent.render(); LtrAgent.render(); DashAgent.refresh();
      }
      var sl2=document.getElementById('sync-label'); if(sl2) sl2.textContent='Connected to live data via Google';
      var el=document.getElementById('sync-timer'); if(el) el.textContent='just now';
      toast('Data refreshed','info');
    });
  },

  _months:function(){
    var sel=document.getElementById('rpt-month'); if(!sel) return;
    var mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var now=new Date();
    for(var i=0;i<12;i++){
      var d=new Date(now.getFullYear(),now.getMonth()-i,1);
      var opt=document.createElement('option');
      opt.value=opt.textContent=mn[d.getMonth()]+' '+d.getFullYear();
      sel.appendChild(opt);
    }
  },

  _showLoader:function(show){
    var loader=document.getElementById('main-loader');
    var content=document.getElementById('main-content');
    if(loader)  loader.style.display=show?'flex':'none';
    if(content) content.style.display=show?'none':'block';
  }
};

function navigate(view){
  document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
  document.querySelectorAll('.sb-item').forEach(function(i){ i.classList.remove('active'); });
  var v=document.getElementById('view-'+view); if(v) v.classList.add('active');
  var s=document.querySelector('[data-view="'+view+'"]'); if(s) s.classList.add('active');
  var tt=document.getElementById('topbar-title');
  var titles={
    dashboard:'Dashboard', masterdata:'EMPLOYEE RECORD', employees:'Active Employees',
    resignations:'Recent Resignations',
    onboarding:'Onboarding Pipeline', letters:'HR Letters', reports:'Monthly Report',
    logs:'Activity Logs', setup:'System Configuration',
    users:'User Management', leave:'Leave Management', recruitment:'Recruitment',
    'self-service':'My Profile'
  };
  if(tt) tt.textContent=titles[view]||view;
  var cta=document.getElementById('top-cta');
  if(cta){
    if((view==='masterdata'||view==='employees') && canDo('add_employee')){ cta.style.display=''; cta.textContent='+ Add Employee'; cta.onclick=function(){ EmpAgent.openAdd(); }; }
    else if(view==='onboarding' && canDo('add_onboarding')){ cta.style.display=''; cta.textContent='+ Add Candidate'; cta.onclick=function(){ OBAgent.openAdd(); }; }
    else if(view==='letters' && canDo('issue_letter')){ cta.style.display=''; cta.textContent='Issue Letter'; cta.onclick=function(){ LtrAgent.openIssue(); }; }
    else if(view==='leave'){ cta.style.display=''; cta.textContent='+ Apply Leave'; cta.onclick=function(){ LeaveAgent.openAdd(); }; }
    else if(view==='recruitment' && canDo('manage_jobs')){ cta.style.display=''; cta.textContent='+ Post Job'; cta.onclick=function(){ RecruitmentAgent.openAddJob(); }; }
    else{ cta.style.display=''; cta.textContent='Offer Letter'; cta.onclick=openOLModal; }
  }
  if(view==='masterdata'||view==='employees') EmpAgent.render(true);
  if(view==='employees') ExcelAgent.populateFilters();
  if(view==='resignations') ResignationAgent.load();
  if(view==='letters') LtrAgent.renderExpPanel();
  if(view==='logs') Logger.loadFromServer();
  if(view==='leave') LeaveAgent.load('');
  if(view==='recruitment') RecruitmentAgent.loadJobs();
  if(view==='users') UserMgmtAgent.load();
}

function showLoginScreen(msg) {
  var overlay = document.getElementById('login-overlay');
  if (!overlay) return;
  overlay.style.display = 'flex';
  document.getElementById('main-wrapper') && (document.getElementById('main-wrapper').style.display = 'none');
  document.getElementById('sidebar')      && (document.getElementById('sidebar').style.display      = 'none');
  var errEl = document.getElementById('login-err');
  if (errEl) { errEl.textContent = msg||''; errEl.style.display = msg ? 'block' : 'none'; }
  var inp = document.getElementById('login-password'); if(inp) { inp.value=''; inp.focus(); }
}

function hideLoginScreen() {
  var overlay = document.getElementById('login-overlay');
  if (overlay) overlay.style.display = 'none';
  document.getElementById('main-wrapper') && (document.getElementById('main-wrapper').style.display = '');
  document.getElementById('sidebar')      && (document.getElementById('sidebar').style.display      = '');
}

function doLogin() {
  var email = (document.getElementById('login-email')||{}).value||'';
  var pass  = (document.getElementById('login-password')||{}).value||'';
  var errEl = document.getElementById('login-err');
  var btn   = document.getElementById('login-btn');
  if (!email || !pass) {
    if(errEl){ errEl.textContent='Email and password are required.'; errEl.style.display='block'; } return;
  }
  if(errEl) errEl.style.display='none';
  if(btn){ btn.disabled=true; btn.textContent='Signing in…'; }
  google.script.run
    .withSuccessHandler(function(r){
      if(btn){ btn.disabled=false; btn.textContent='Sign In'; }
      if(!r || !r.success){
        if(errEl){ errEl.textContent=r?r.error:'Login failed.'; errEl.style.display='block'; } return;
      }
      APP.token = r.token;
      APP.user  = r.profile;
      sessionStorage.setItem('ughr_token', r.token);
      hideLoginScreen();
      AgentManager.init();
    })
    .withFailureHandler(function(e){
      if(btn){ btn.disabled=false; btn.textContent='Sign In'; }
      if(errEl){ errEl.textContent='Error: '+(e.message||e); errEl.style.display='block'; }
    })
    .loginUser(email, pass);
}

function doLogout() {
  var token = APP.token || sessionStorage.getItem('ughr_token');
  sessionStorage.removeItem('ughr_token');
  APP.token = '';
  google.script.run.logoutUser(token);
  showLoginScreen('You have been signed out.');
}

window.addEventListener('DOMContentLoaded', function() {
  var token = sessionStorage.getItem('ughr_token');
  if (token) {
    APP.token = token;
    google.script.run
      .withSuccessHandler(function(r) {
        if (r && r.success) {
          APP.user = r.profile;
          hideLoginScreen();
          AgentManager.init();
        } else {
          sessionStorage.removeItem('ughr_token');
          APP.token = '';
          showLoginScreen(r && r.error === 'SESSION_EXPIRED' ? 'Session expired. Please log in again.' : '');
        }
      })
      .withFailureHandler(function() { showLoginScreen(); })
      .validateSession(token);
  } else {
    showLoginScreen();
  }
});

          '<button class="btn btn-danger btn-icon btn-sm" data-action="del-user" data-email="'+esc(u.EMAIL)+'" title="Deactivate">&#10060;</button>'+
        '</div></td></tr>';
    }).join('');
  },
  openAdd: function() {
    document.getElementById('uf-email').value = '';
    document.getElementById('uf-name').value = '';
    document.getElementById('uf-role').value = '';
    document.getElementById('uf-entities').value = 'ALL';
    document.getElementById('uf-active').value = 'TRUE';
    document.getElementById('uf-edit-email').value = '';
    document.getElementById('m-user-ttl').textContent = 'Add User';
    openM('m-user');
  },
  openEdit: function(email) {
    var u = this._data.find(function(x){ return x.EMAIL === email; });
    if(!u) return;
    document.getElementById('uf-email').value = u.EMAIL;
    document.getElementById('uf-email').readOnly = true;
    document.getElementById('uf-name').value = u.DISPLAY_NAME||'';
    document.getElementById('uf-role').value = u.ROLE||'';
    document.getElementById('uf-entities').value = u.ENTITIES||'ALL';
    document.getElementById('uf-active').value = (u.ACTIVE==='TRUE'||u.ACTIVE==='true') ? 'TRUE' : 'FALSE';
    document.getElementById('uf-edit-email').value = u.EMAIL;
    document.getElementById('m-user-ttl').textContent = 'Edit User';
    openM('m-user');
  },
  save: function() {
    var email = document.getElementById('uf-email').value.trim().toLowerCase();
    var name  = document.getElementById('uf-name').value.trim();
    var role  = document.getElementById('uf-role').value;
    var ents  = document.getElementById('uf-entities').value.trim();
    var active= document.getElementById('uf-active').value;
    if(!email || !role) { toast('Email and role are required','error'); return; }
    var data = {EMAIL:email, DISPLAY_NAME:name, ROLE:role, ENTITIES:ents||'ALL', ACTIVE:active};
    GAS.saveUser(data, function(r) {
      if(!r || !r.success) { toast('Error: '+(r?r.error:'Unknown'),'error'); return; }
      toast('User saved','success');
      closeM('m-user');
      document.getElementById('uf-email').readOnly = false;
      UserMgmtAgent.load();
    });
  },
  deactivate: function(email) {
    if(!confirm('Deactivate user: '+email+'?')) return;
    GAS.deleteUser(email, function(r) {
      if(!r || !r.success) { toast('Error: '+(r?r.error:'Unknown'),'error'); return; }
      toast('User deactivated','success');
      UserMgmtAgent.load();
    });
  }
};

// ============================================================
// RESIGNATION AGENT — Deletion_Log viewer (newest first)
// ============================================================
var ResignationAgent = {
  _data: [],

  // Normalise any date string to DD/MM/YYYY
  _fmt: function(s) {
    if(!s || s === '—') return '—';
    // Already DD/MM/YYYY
    if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;
    // YYYY-MM-DD
    var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m) return m[3]+'/'+m[2]+'/'+m[1];
    // Fallback: try JS Date parse (handles GAS toString output)
    var d = new Date(s);
    if(!isNaN(d)) return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear();
    return s;
  },

  // Parse a DD/MM/YYYY (or YYYY-MM-DD) string to a Date object
  _toDate: function(s) {
    if(!s) return null;
    var m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
    if(m) return new Date(Number(m[3]), Number(m[2])-1, Number(m[1]));
    m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m) return new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
    var d = new Date(s);
    return isNaN(d) ? null : d;
  },

  // Returns "X yr Y mo" or "X mo" calculated between join and exit dates
  _yos: function(joinStr, exitStr) {
    var join = this._toDate(joinStr);
    var exit = this._toDate(exitStr);
    if(!join || !exit || exit < join) return '—';
    var years  = exit.getFullYear() - join.getFullYear();
    var months = exit.getMonth()    - join.getMonth();
    if(exit.getDate() < join.getDate()) months--;
    if(months < 0) { years--; months += 12; }
    if(years < 0)  return '—';
    if(years === 0 && months === 0) return '< 1 mo';
    if(years === 0) return months + ' mo';
    if(months === 0) return years + ' yr' + (years !== 1 ? 's' : '');
    return years + ' yr ' + months + ' mo';
  },

  load: function() {
    var tb = document.getElementById('res-tbody');
    if(tb) tb.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:20px;color:var(--muted)">Loading...</td></tr>';
    GAS.getResignations(function(r) {
      if(!r || !r.success) { toast('Error loading resignations','error'); return; }
      ResignationAgent._data = r.data || [];
      ResignationAgent.render();
    });
  },

  _filtered: function() {
    var q   = (document.getElementById('res-q')||{}).value||'';
    var qs  = q.toLowerCase();
    var org = (document.getElementById('res-org')||{}).value||'';
    return this._data.filter(function(r) {
      var match = !qs ||
        (r.EMP_ID||'').toLowerCase().indexOf(qs)>=0 ||
        (r.FULL_NAME||'').toLowerCase().indexOf(qs)>=0;
      var matchOrg = !org || (r.GROUP||r.ENTITY||'') === org;
      return match && matchOrg;
    });
  },

  render: function() {
    var tb  = document.getElementById('res-tbody'); if(!tb) return;
    var cnt = document.getElementById('res-cnt');
    var data = this._filtered();
    if(cnt) cnt.textContent = data.length;
    if(!data.length) {
      tb.innerHTML = '<tr><td colspan="11" style="text-align:center;padding:32px;color:var(--muted)">No resignation records found.</td></tr>';
      return;
    }
    // Reset bulk controls
    var selAll = document.getElementById('res-sel-all'); if(selAll) selAll.checked = false;
    var bulkBtn = document.getElementById('res-bulk-btn'); if(bulkBtn) bulkBtn.style.display = 'none';
    var bulkCnt = document.getElementById('res-bulk-count'); if(bulkCnt) bulkCnt.textContent = '0';
    var self = this;
    tb.innerHTML = data.map(function(r, idx) {
      var org     = r.GROUP || r.ENTITY || '—';
      var entCls  = {USG:'bp',UG:'bs',UST:'bo','USG-M':'bn'}[org]||'bn';
      var joinFmt = self._fmt(r.DATE_OF_JOIN  || '');
      var exitFmt = self._fmt(r.DELETED_DATE  || '');
      var yos     = self._yos(r.DATE_OF_JOIN  || '', r.DELETED_DATE || '');
      var chkTd = '<td><input type="checkbox" class="res-chk" data-empid="'+esc(r.EMP_ID||'')+'" data-name="'+esc((r.FULL_NAME||'').replace(/"/g,'&quot;'))+'" onchange="ResignationAgent.updateBulkCount()"/></td>';
      var btnHtml = '<button class="btn btn-secondary btn-sm" style="font-size:10.5px;white-space:nowrap" '+
          'data-exltr="'+esc(r.EMP_ID||'')+'" '+
          'onclick="genExpLetter(\''+esc(r.EMP_ID||'')+'\',\''+esc((r.FULL_NAME||'').replace(/'/g,''))+'\')">'+
          '&#128196; Exp Letter</button>';
      return '<tr>'+
        chkTd+
        '<td style="color:var(--muted2);font-size:11px;text-align:center">'+(idx+1)+'</td>'+
        '<td style="font-family:monospace;font-size:11.5px;font-weight:600;color:var(--navy)">'+esc(r.EMP_ID||'—')+'</td>'+
        '<td style="font-weight:600">'+esc(r.FULL_NAME||'—')+'</td>'+
        '<td style="font-size:11.5px;color:var(--muted)">'+esc(r.DESIGNATION||'—')+'</td>'+
        '<td style="font-size:11.5px">'+esc(joinFmt)+'</td>'+
        '<td style="font-size:11.5px;font-weight:600;color:var(--red,#c83030)">'+esc(exitFmt)+'</td>'+
        '<td style="font-size:11px;font-weight:600;color:var(--teal,#007a8a);white-space:nowrap">'+esc(yos)+'</td>'+
        '<td><span class="badge '+entCls+'">'+esc(org)+'</span></td>'+
        '<td style="font-size:11px;color:var(--muted);max-width:160px;word-break:break-word">'+esc(r.REASON||'—')+'</td>'+
        '<td>'+btnHtml+'</td>'+
      '</tr>';
    }).join('');
  },

  updateBulkCount: function() {
    var checked = document.querySelectorAll('.res-chk:checked');
    var btn = document.getElementById('res-bulk-btn');
    var cnt = document.getElementById('res-bulk-count');
    if(cnt) cnt.textContent = checked.length;
    if(btn) btn.style.display = checked.length ? '' : 'none';
  },
  toggleSelectAll: function(checked) {
    document.querySelectorAll('.res-chk').forEach(function(c){ c.checked = checked; });
    this.updateBulkCount();
  },
  generateBulk: function() {
    var items = [];
    document.querySelectorAll('.res-chk:checked').forEach(function(c){
      items.push({id: c.dataset.empid, name: c.dataset.name});
    });
    if(!items.length){ toast('No employees selected','error'); return; }
    var btn = document.getElementById('res-bulk-btn');
    if(btn) btn.disabled = true;
    toast('Generating '+items.length+' letter'+(items.length>1?'s':'')+'…','info');
    var idx = 0, collectedPdfs = [];
    function next() {
      if(idx >= items.length){
        if(!collectedPdfs.length){ toast('No PDFs generated','error'); if(btn) btn.disabled=false; return; }
        toast('Merging '+collectedPdfs.length+' PDFs…','info');
        var mFile = 'Experience_Letters_'+collectedPdfs.length+'_employees.pdf';
        _mergeBulkExpPdfs(collectedPdfs, function(url){
          _openPdfResult(url, mFile);
          if(btn){ btn.disabled=false; btn.style.display='none'; }
          var sa=document.getElementById('res-sel-all'); if(sa) sa.checked=false;
          GAS.call('getHRDocs',[],function(dr){
            if(dr&&dr.success){ APP.hrDocs=dr.data||[]; LtrAgent.render(); ResignationAgent.render(); }
          });
        });
        return;
      }
      var item = items[idx++];
      toast('('+(idx)+'/'+items.length+') '+esc(item.name)+'…','info');
      genExpLetter(item.id, item.name, function(pdf){ if(pdf) collectedPdfs.push(pdf); next(); });
    }
    next();
  },

  resetF: function() {
    var q=document.getElementById('res-q');   if(q)   q.value='';
    var o=document.getElementById('res-org'); if(o)   o.value='';
    this.render();
  }
};
</script>
