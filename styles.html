<style>
/* ============================================================
   HR COMMAND SYSTEM v2  —  Design System
============================================================ */
:root {
  --bg:        #F8FAFC;
  --surface:   #FFFFFF;
  --surface2:  #F1F5F9;
  --border:    #E2E8F0;
  --navy:      #2563EB;
  --navy-dark: #1D4ED8;
  --navy-light:#EFF6FF;
  --accent:    #0891B2;
  --gold:      #D97706;
  --red:       #DC2626;
  --red-light: #FEF2F2;
  --green:     #16A34A;
  --green-light:#F0FDF4;
  --amber:     #F59E0B;
  --amber-light:#FFFBEB;
  --text:      #0F172A;
  --text-muted:#64748B;
  --text-light:#94A3B8;
  --sidebar-w: 240px;
  --topbar-h:  56px;
  --radius:    8px;
  --radius-lg: 12px;
  --shadow:    0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 15px rgba(0,0,0,.07), 0 4px 6px rgba(0,0,0,.05);
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 14px;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  height: 100vh;
  overflow: hidden;
}

/* ── Layout ── */
#app { display: flex; height: 100vh; overflow: hidden; }

/* ── Sidebar ── */
#sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  transition: width .2s ease, min-width .2s ease;
  z-index: 100;
}
#sidebar.collapsed { width: 56px; min-width: 56px; }
#sidebar-brand {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: var(--topbar-h);
  overflow: hidden;
}
#sidebar-brand .brand-icon {
  width: 28px; height: 28px;
  background: var(--navy);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 13px; font-weight: 700;
  flex-shrink: 0;
}
#sidebar-brand .brand-name {
  font-size: 13px; font-weight: 600; color: var(--text);
  white-space: nowrap; overflow: hidden;
}
.collapsed #sidebar-brand .brand-name { display: none; }
#sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
.nav-section-label {
  font-size: 10px; font-weight: 600; color: var(--text-light);
  text-transform: uppercase; letter-spacing: .08em;
  padding: 12px 16px 4px;
  white-space: nowrap; overflow: hidden;
}
.collapsed .nav-section-label { display: none; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 16px; cursor: pointer;
  border-radius: 6px; margin: 1px 8px;
  transition: background .15s; position: relative;
  white-space: nowrap; overflow: hidden;
  text-decoration: none; color: var(--text-muted);
  font-size: 13px;
}
.nav-item:hover  { background: var(--surface2); color: var(--text); }
.nav-item.active { background: var(--navy-light); color: var(--navy); font-weight: 500; }
.nav-item .nav-icon {
  font-size: 16px; flex-shrink: 0; width: 20px;
  text-align: center; line-height: 1;
}
.nav-item .nav-label { overflow: hidden; }
.collapsed .nav-item .nav-label { display: none; }
.nav-item .nav-badge {
  margin-left: auto; background: var(--red); color: white;
  font-size: 10px; font-weight: 700; border-radius: 10px;
  padding: 1px 6px; min-width: 18px; text-align: center;
}
.collapsed .nav-item .nav-badge { display: none; }
#sidebar-footer {
  border-top: 1px solid var(--border); padding: 8px;
}

/* ── Main area ── */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* ── Topbar ── */
#topbar {
  height: var(--topbar-h); min-height: var(--topbar-h);
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px; z-index: 50;
}
#topbar-toggle {
  background: none; border: none; cursor: pointer;
  color: var(--text-muted); font-size: 18px; padding: 4px 6px;
  border-radius: 6px; transition: background .15s;
}
#topbar-toggle:hover { background: var(--surface2); color: var(--text); }
#global-search-wrap { flex: 1; max-width: 400px; position: relative; }
#global-search {
  width: 100%; padding: 7px 12px 7px 36px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface2); font-size: 13px; color: var(--text);
  outline: none; transition: border-color .15s, background .15s;
}
#global-search:focus { border-color: var(--navy); background: var(--surface); }
#global-search-icon {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--text-light); pointer-events: none;
}
#search-results {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-lg);
  max-height: 320px; overflow-y: auto; z-index: 1000; display: none;
}
.search-result-item {
  padding: 10px 14px; cursor: pointer; display: flex;
  align-items: center; gap: 10px; transition: background .1s;
}
.search-result-item:hover { background: var(--surface2); }
.search-result-item .sri-id { font-size: 11px; color: var(--text-muted); font-weight: 600; }
.search-result-item .sri-name { font-size: 13px; font-weight: 500; }
#topbar-spacer { flex: 1; }
#topbar-notif {
  position: relative; background: none; border: none;
  cursor: pointer; color: var(--text-muted); font-size: 18px;
  padding: 6px; border-radius: 6px; transition: background .15s;
}
#topbar-notif:hover { background: var(--surface2); color: var(--text); }
#notif-badge {
  position: absolute; top: 2px; right: 2px;
  background: var(--red); color: white;
  font-size: 9px; font-weight: 700; border-radius: 8px;
  padding: 1px 4px; min-width: 16px; text-align: center; display: none;
}
#topbar-user {
  display: flex; align-items: center; gap: 8px;
  cursor: pointer; padding: 6px 8px; border-radius: var(--radius);
  transition: background .15s;
}
#topbar-user:hover { background: var(--surface2); }
#topbar-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--navy); color: white;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
}
#topbar-username { font-size: 13px; font-weight: 500; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#topbar-role { font-size: 11px; color: var(--text-muted); }

/* ── Content area ── */
#content { flex: 1; overflow-y: auto; padding: 24px; }
.view { display: none; }
.view.active { display: block; }

/* ── Page header ── */
.page-header { margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
.page-title { font-size: 20px; font-weight: 700; }
.page-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
.page-actions { margin-left: auto; display: flex; gap: 8px; }

/* ── Stat cards (bento grid) ── */
.bento-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 18px;
  box-shadow: var(--shadow);
}
.stat-card .stat-label { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-bottom: 6px; }
.stat-card .stat-value { font-size: 28px; font-weight: 700; line-height: 1; }
.stat-card .stat-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.stat-card.accent-navy  { border-top: 3px solid var(--navy); }
.stat-card.accent-green { border-top: 3px solid var(--green); }
.stat-card.accent-gold  { border-top: 3px solid var(--gold); }
.stat-card.accent-red   { border-top: 3px solid var(--red); }
.stat-card.accent-accent{ border-top: 3px solid var(--accent); }

/* ── Table ── */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow); overflow: hidden;
}
.card-header {
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.card-title { font-size: 14px; font-weight: 600; }
.card-actions { margin-left: auto; display: flex; gap: 8px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
thead th {
  position: sticky; top: 0; z-index: 1;
  background: var(--surface2); padding: 10px 14px;
  font-size: 11px; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: .05em;
  border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap;
}
tbody td {
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  font-size: 13px; vertical-align: middle;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--surface2); }
.table-empty { text-align: center; padding: 40px; color: var(--text-muted); }

/* ── Pagination ── */
.pagination { display: flex; align-items: center; gap: 6px; padding: 12px 16px; border-top: 1px solid var(--border); }
.pagination .pg-info { font-size: 12px; color: var(--text-muted); margin-right: auto; }
.pg-btn {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 10px; font-size: 12px;
  cursor: pointer; transition: background .15s;
}
.pg-btn:hover:not(:disabled) { background: var(--surface2); }
.pg-btn:disabled { opacity: .4; cursor: default; }
.pg-btn.active { background: var(--navy); color: white; border-color: var(--navy); }

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: var(--radius); border: 1px solid transparent;
  font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s;
  text-decoration: none; white-space: nowrap;
}
.btn-primary   { background: var(--navy); color: white; }
.btn-primary:hover   { background: var(--navy-dark); }
.btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border); }
.btn-secondary:hover { background: var(--surface2); }
.btn-danger    { background: var(--red); color: white; }
.btn-danger:hover    { background: #B91C1C; }
.btn-success   { background: var(--green); color: white; }
.btn-success:hover   { background: #15803D; }
.btn-ghost     { background: transparent; color: var(--text-muted); border-color: transparent; }
.btn-ghost:hover     { background: var(--surface2); color: var(--text); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-xs { padding: 3px 8px; font-size: 11px; }
.btn:disabled { opacity: .5; cursor: default; }

/* ── Badges ── */
.badge {
  display: inline-flex; align-items: center;
  padding: 2px 8px; border-radius: 20px;
  font-size: 11px; font-weight: 600;
}
.badge-blue   { background: var(--navy-light);   color: var(--navy); }
.badge-green  { background: var(--green-light);  color: var(--green); }
.badge-red    { background: var(--red-light);    color: var(--red); }
.badge-gold   { background: var(--amber-light);  color: var(--gold); }
.badge-gray   { background: var(--surface2);     color: var(--text-muted); }
.badge-accent { background: #ECFEFF;             color: var(--accent); }

/* ── Forms ── */
.form-group { margin-bottom: 14px; }
.form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 8px 12px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); color: var(--text); font-size: 13px;
  transition: border-color .15s; outline: none; font-family: inherit;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--navy); }
.form-textarea { resize: vertical; min-height: 80px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.form-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.form-error { font-size: 11px; color: var(--red); margin-top: 4px; }
.form-banner {
  padding: 8px 12px; border-radius: var(--radius);
  font-size: 12px; margin-bottom: 12px; display: none;
}
.form-banner.success { background: var(--green-light); color: var(--green); display: block; }
.form-banner.error   { background: var(--red-light);   color: var(--red);   display: block; }
.form-banner.warning { background: var(--amber-light); color: var(--gold);  display: block; }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 500; padding: 20px; display: none;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg); width: 100%; max-width: 520px;
  max-height: 90vh; overflow-y: auto;
  display: flex; flex-direction: column;
}
.modal-lg { max-width: 700px; }
.modal-xl { max-width: 900px; }
.modal-header {
  padding: 18px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  position: sticky; top: 0; background: var(--surface); z-index: 1;
}
.modal-title { font-size: 16px; font-weight: 600; flex: 1; }
.modal-close {
  background: none; border: none; cursor: pointer;
  color: var(--text-muted); font-size: 20px; padding: 2px 6px;
  border-radius: 4px; transition: background .15s; line-height: 1;
}
.modal-close:hover { background: var(--surface2); color: var(--text); }
.modal-body { padding: 20px; flex: 1; }
.modal-footer {
  padding: 14px 20px; border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px;
  position: sticky; bottom: 0; background: var(--surface);
}

/* ── Toast ── */
#toast-container {
  position: fixed; bottom: 24px; right: 24px;
  display: flex; flex-direction: column; gap: 8px; z-index: 9999;
  pointer-events: none;
}
.toast {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; border-radius: var(--radius);
  box-shadow: var(--shadow-lg); min-width: 260px; max-width: 380px;
  background: #1E293B; color: white; font-size: 13px;
  pointer-events: all; animation: toastIn .2s ease;
}
.toast.success { background: var(--green); }
.toast.error   { background: var(--red); }
.toast.warning { background: var(--gold); }
.toast-msg { flex: 1; }
.toast-action { background: rgba(255,255,255,.2); border: none; color: white;
  padding: 4px 10px; border-radius: 4px; font-size: 12px;
  cursor: pointer; font-weight: 600; white-space: nowrap;
}
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ── Notification panel ── */
#notif-panel {
  position: absolute; top: calc(var(--topbar-h) + 4px); right: 16px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
  width: 340px; max-height: 440px; overflow-y: auto;
  z-index: 200; display: none;
}
#notif-panel.open { display: block; }
.notif-header { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; display: flex; align-items: center; }
.notif-mark-all { margin-left: auto; font-size: 11px; color: var(--navy); cursor: pointer; }
.notif-item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; }
.notif-item:hover { background: var(--surface2); }
.notif-item.unread { background: var(--navy-light); }
.notif-item .notif-msg { font-size: 13px; }
.notif-item .notif-time { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
.notif-empty { padding: 32px; text-align: center; color: var(--text-muted); font-size: 13px; }

/* ── PDF result modal ── */
#pdf-frame { width: 100%; height: 480px; border: none; border-radius: var(--radius); }

/* ── SLA badges ── */
.sla-ok       { color: var(--green); font-weight: 600; font-size: 11px; }
.sla-at-risk  { color: var(--gold);  font-weight: 600; font-size: 11px; }
.sla-overdue  { color: var(--red);   font-weight: 600; font-size: 11px; }

/* ── Progress bar ── */
.progress-bar { background: var(--surface2); border-radius: 4px; height: 6px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--navy); border-radius: 4px; transition: width .3s; }

/* ── Login overlay ── */
#login-overlay {
  position: fixed; inset: 0;
  background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 50%, #0891B2 100%);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
}
.login-card {
  background: white; border-radius: 16px;
  box-shadow: 0 25px 50px rgba(0,0,0,.25);
  padding: 40px; width: 100%; max-width: 380px;
}
.login-logo { text-align: center; margin-bottom: 28px; }
.login-logo .logo-icon {
  width: 56px; height: 56px; background: var(--navy);
  border-radius: 14px; display: inline-flex; align-items: center;
  justify-content: center; color: white; font-size: 22px; font-weight: 800;
  margin-bottom: 12px;
}
.login-logo h1 { font-size: 20px; font-weight: 700; }
.login-logo p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
.login-error { background: var(--red-light); color: var(--red); padding: 10px 14px; border-radius: var(--radius); font-size: 13px; margin-bottom: 14px; display: none; }

/* ── Filter bar ── */
.filter-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.filter-input { padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; outline: none; background: var(--surface); }
.filter-input:focus { border-color: var(--navy); }

/* ── Steps tracker ── */
.steps-list { display: flex; flex-direction: column; gap: 6px; }
.step-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: var(--surface2);
  border-radius: var(--radius); border: 1px solid var(--border);
}
.step-num { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.step-num.done { background: var(--green); color: white; }
.step-num.pending { background: var(--border); color: var(--text-muted); }
.step-name { flex: 1; font-size: 13px; }
.step-meta { font-size: 11px; color: var(--text-muted); }

/* ── NSI Card ── */
.nsi-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 16px;
  box-shadow: var(--shadow);
}
.nsi-card-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.nsi-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--navy); color: white;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700; flex-shrink: 0;
}
.nsi-name { font-size: 14px; font-weight: 600; }
.nsi-sub  { font-size: 12px; color: var(--text-muted); }
.nsi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
.nsi-grid-item .nsi-key { font-size: 10px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
.nsi-grid-item .nsi-val { font-size: 12px; font-weight: 500; }

/* ── Responsive ── */
@media (max-width: 900px) {
  :root { --sidebar-w: 56px; }
  .nav-item .nav-label, .nav-section-label, #sidebar-brand .brand-name,
  .nav-item .nav-badge { display: none; }
}
@media (max-width: 600px) {
  #sidebar { display: none; }
  #content { padding: 16px; }
  .form-row, .form-row-3 { grid-template-columns: 1fr; }
  .bento-grid { grid-template-columns: 1fr 1fr; }
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-light); }

/* ── Utility ── */
.text-muted { color: var(--text-muted); }
.text-sm    { font-size: 12px; }
.text-xs    { font-size: 11px; }
.fw-600     { font-weight: 600; }
.fw-700     { font-weight: 700; }
.mt-4       { margin-top: 4px; }
.mt-8       { margin-top: 8px; }
.mt-16      { margin-top: 16px; }
.mb-16      { margin-bottom: 16px; }
.flex       { display: flex; align-items: center; }
.gap-8      { gap: 8px; }
.gap-12     { gap: 12px; }
.ml-auto    { margin-left: auto; }
.d-none     { display: none !important; }
.w-100      { width: 100%; }
</style>
