<script>
'use strict';

// ============================================================
// FLAG MAP
// ============================================================
var FLAG_MAP={'INDIA':'🇮🇳','PAKISTAN':'🇵🇰','PHILIPPINES':'🇵🇭','NEPAL':'🇳🇵','SRI LANKA':'🇱🇰','BANGLADESH':'🇧🇩','EGYPT':'🇪🇬','KENYA':'🇰🇪','NIGERIA':'🇳🇬','ETHIOPIA':'🇪🇹','UGANDA':'🇺🇬','GHANA':'🇬🇭','JORDAN':'🇯🇴','INDONESIA':'🇮🇩','UAE':'🇦🇪','SAUDI ARABIA':'🇸🇦','MYANMAR':'🇲🇲','VIETNAM':'🇻🇳','THAILAND':'🇹🇭','CHINA':'🇨🇳','MOROCCO':'🇲🇦','TANZANIA':'🇹🇿','SOUTH AFRICA':'🇿🇦','ZIMBABWE':'🇿🇼','SUDAN':'🇸🇩'};
function getFlag(nat){ return FLAG_MAP[String(nat||'').toUpperCase()]||'🌍'; }

// ENTITY normalise (4 valid: USG, UG, UST, USG-M)
function normEnt(raw){
  var v=String(raw||'').trim().toUpperCase();
  if(v==='UGU'||v==='USU') return 'UG';
  if(v==='USG-M') return 'USG-M';
  if(v==='USG') return 'USG';
  if(v==='UG') return 'UG';
  if(v==='UST') return 'UST';
  return v||null;
}

// ============================================================
// APP STATE
// ============================================================
var APP={config:{},master:[],deletions:[],onboarding:[],hrDocs:[],summary:[],loaded:false};
// Track if any modal is open (to block auto-refresh during editing)
var EDITING=false;

function getActiveEmployees(){
  var delIds={};
  APP.deletions.forEach(function(d){ if(d.EMP_ID) delIds[String(d.EMP_ID).trim()]=true; });
  // deduplicate by ID
  var seen={},result=[];
  APP.master.forEach(function(r){
    var id=String(r.ID||'').trim();
    if(!id) return;
    if(seen[id]) return;
    if(r.STATUS==='DELETED'||delIds[id]) return;
    seen[id]=true;
    result.push(r);
  });
  return result;
}

// ============================================================
// UTILITIES
// ============================================================
function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function today(){ return new Date().toISOString().split('T')[0]; }
function todayDisplay(){ return new Date().toLocaleDateString('en-AE',{day:'2-digit',month:'long',year:'numeric'}); }
function genId(p){ return (p||'ID')+'-'+Date.now().toString().slice(-8); }

function toast(msg,type){
  var box=document.getElementById('tbox');
  var el=document.createElement('div'); el.className='toast t-'+(type||'info'); el.textContent=msg;
  box.appendChild(el);
  setTimeout(function(){ el.style.opacity='0'; el.style.transform='translateX(110%)'; el.style.transition='.3s'; setTimeout(function(){ el.remove(); },300); },3500);
}
function openM(id){ EDITING=true; document.getElementById(id).classList.add('show'); }
function closeM(id){ document.getElementById(id).classList.remove('show'); EDITING=false; }
document.addEventListener('click',function(e){ if(e.target.classList.contains('modal-overlay')){ e.target.classList.remove('show'); EDITING=false; } });

// ============================================================
// GLOBAL SEARCH — searches ID, Name, Passport No, EID No
// ============================================================
var GlobalSearch = {
  _timer: null,
  _lastQ: '',

  query: function(q) {
    var self = this;
    q = String(q||'').trim();
    var clearBtn = document.getElementById('gsearch-clear');
    if(clearBtn) clearBtn.style.display = q ? 'block' : 'none';
    clearTimeout(this._timer);
    if(!q){ this.hide(); this._lastQ=''; return; }
    this._timer = setTimeout(function(){ self._run(q); }, 180);
  },

  _run: function(q) {
    this._lastQ = q;
    var ql = q.toLowerCase();
    var results = [];

    // Search active employees across 4 fields
    getActiveEmployees().forEach(function(r){
      var id   = String(r.ID||'').toLowerCase();
      var name = String(r.NAME||'').toLowerCase();
      var pp   = String(r['PASSPORT NO']||'').toLowerCase();
      var eid  = String(r['EID NO']||'').toLowerCase();
      if(id.indexOf(ql)>=0 || name.indexOf(ql)>=0 || pp.indexOf(ql)>=0 || eid.indexOf(ql)>=0){
        results.push({type:'emp', data:r});
      }
      if(results.length >= 12) return;
    });

    // Also search onboarding
    APP.onboarding.forEach(function(c){
      if(results.length >= 15) return;
      var name = String(c.FULL_NAME||'').toLowerCase();
      var pp   = String(c.PASSPORT_NO||'').toLowerCase();
      if(name.indexOf(ql)>=0 || pp.indexOf(ql)>=0){
        results.push({type:'ob', data:c});
      }
    });

    this._render(results, q);
  },

  _hl: function(text, q) {
    if(!q || !text) return esc(text);
    var escaped = esc(text);
    var escapedQ = esc(q);
    var re = new RegExp('('+escapedQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')', 'gi');
    return escaped.replace(re, '<mark class="hl">$1</mark>');
  },

  _render: function(results, q) {
    var box = document.getElementById('gsearch-results'); if(!box) return;
    box.classList.add('open');

    if(!results.length){
      box.innerHTML = '<div class="gsearch-header"><span>Search Results</span><span>0 found</span></div><div class="gsearch-empty">&#128269; No results for &ldquo;'+esc(q)+'&rdquo;<br><span style="font-size:10.5px">Try ID, name, passport no, or EID</span></div>';
      return;
    }

    var empCount = results.filter(function(r){ return r.type==='emp'; }).length;
    var obCount  = results.filter(function(r){ return r.type==='ob';  }).length;

    var html = '<div class="gsearch-header"><span>Search Results</span><span>'+results.length+' found</span></div>';

    var self = this;
    results.forEach(function(item){
      if(item.type === 'emp'){
        var r = item.data;
        var initials = (r.NAME||'?').substring(0,2).toUpperCase();
        var licCls = {PSBD:'bp',SIRA:'bs',NIL:'bn',OTHER:'bo'}[r['LIC AUTH']||'NIL']||'bn';
        html += '<div class="gsearch-item" onclick="GlobalSearch.showDetail(\''+esc(r.ID||'')+'\')">'+
          '<div class="gsearch-avatar">'+esc(initials)+'</div>'+
          '<div class="gsearch-info">'+
            '<div class="gsearch-name">'+self._hl(r.NAME||'—', q)+'</div>'+
            '<div class="gsearch-meta">ID: '+self._hl(r.ID||'—',q)+' &nbsp;|&nbsp; PP: '+self._hl(r['PASSPORT NO']||'—',q)+' &nbsp;|&nbsp; EID: '+self._hl(r['EID NO']||'—',q)+'</div>'+
          '</div>'+
          '<span class="gsearch-tag badge '+licCls+'">'+esc(r['LIC AUTH']||'NIL')+'</span>'+
        '</div>';
      } else {
        var c = item.data;
        var initials2 = (c.FULL_NAME||'?').substring(0,2).toUpperCase();
        html += '<div class="gsearch-item" style="opacity:.85" onclick="GlobalSearch.showOnboardDetail(\''+esc(c.OB_ID||'')+'\')">'+
          '<div class="gsearch-avatar" style="background:linear-gradient(135deg,#b87000,#8a5200)">'+esc(initials2)+'</div>'+
          '<div class="gsearch-info">'+
            '<div class="gsearch-name">'+self._hl(c.FULL_NAME||'—',q)+'</div>'+
            '<div class="gsearch-meta">Onboarding &nbsp;|&nbsp; PP: '+self._hl(c.PASSPORT_NO||'—',q)+' &nbsp;|&nbsp; Status: '+esc(c.STATUS||'—')+'</div>'+
          '</div>'+
          '<span class="gsearch-tag badge bo">OB</span>'+
        '</div>';
      }
    });

    box.innerHTML = html;
  },

  showDetail: function(empId) {
    var r = APP.master.find(function(x){ return x.ID === empId; });
    if(!r){ toast('Employee not found','error'); return; }
    this.clear();

    var licCls  = {PSBD:'bp',SIRA:'bs',NIL:'bn',OTHER:'bo'}[r['LIC AUTH']||'NIL']||'bn';
    var locColor = r.STATUS==='ABU DHABI'?'#1e4799':r.STATUS==='DUBAI'?'#007a8a':'var(--muted)';
    var initials = (r.NAME||'?').substring(0,2).toUpperCase();

    var body = document.getElementById('empdetail-body');
    body.innerHTML =
      '<div class="empdetail-head">'+
        '<div class="empdetail-avatar">'+esc(initials)+'</div>'+
        '<div class="empdetail-headinfo">'+
          '<div class="ename">'+esc(r.NAME||'—')+'</div>'+
          '<div class="emeta">'+
            '<span class="badge '+licCls+'" style="margin-right:5px">'+esc(r['LIC AUTH']||'NIL')+'</span>'+
            '<span style="color:'+locColor+';font-weight:700;font-size:11px">'+esc(r.STATUS||'—')+'</span>'+
          '</div>'+
        '</div>'+
      '</div>'+
      '<div class="empdetail-grid">'+
        '<div class="empdetail-row"><div class="empdetail-label">Employee ID</div><div class="empdetail-val">'+esc(r.ID||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Entity / Company</div><div class="empdetail-val">'+esc(normEnt(r.ENTITY)||'—')+'</div></div>'+
        '<div class="empdetail-row full"><div class="empdetail-label">Full Name</div><div class="empdetail-val">'+esc(r.NAME||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Passport No</div><div class="empdetail-val" style="font-family:monospace;font-size:12px">'+esc(r['PASSPORT NO']||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Emirates ID</div><div class="empdetail-val" style="font-family:monospace;font-size:12px;color:var(--teal)">'+esc(r['EID NO']||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Nationality</div><div class="empdetail-val">'+getFlag(r.NATIONALITY||'')+' '+esc(r.NATIONALITY||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Designation</div><div class="empdetail-val">'+esc(r.DESIGNATION||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Date of Joining</div><div class="empdetail-val">'+esc(r['DATE OF JOIN']||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Date of Birth</div><div class="empdetail-val">'+esc(r['BIRTH DATE']||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Age</div><div class="empdetail-val">'+esc(r.AGE||'—')+'</div></div>'+
      '</div>';

    // Wire edit button
    var editBtn = document.getElementById('empdetail-edit-btn');
    if(editBtn){
      editBtn.onclick = function(){
        closeM('m-empdetail');
        EmpAgent.openEdit(empId);
      };
    }
    openM('m-empdetail');
  },

  showOnboardDetail: function(obId) {
    var c = APP.onboarding.find(function(x){ return x.OB_ID === obId; });
    if(!c){ toast('Candidate not found','error'); return; }
    this.clear();
    var initials = (c.FULL_NAME||'?').substring(0,2).toUpperCase();
    var body = document.getElementById('empdetail-body');
    body.innerHTML =
      '<div class="empdetail-head">'+
        '<div class="empdetail-avatar" style="background:linear-gradient(135deg,#b87000,#8a5200)">'+esc(initials)+'</div>'+
        '<div class="empdetail-headinfo">'+
          '<div class="ename">'+esc(c.FULL_NAME||'—')+'</div>'+
          '<div class="emeta">'+
            '<span class="badge bo" style="margin-right:5px">Onboarding</span>'+
            '<span class="badge '+(c.STATUS==='Pending'?'bo':c.STATUS==='Transferred'?'bg2':'bn')+'">'+esc(c.STATUS||'—')+'</span>'+
          '</div>'+
        '</div>'+
      '</div>'+
      '<div class="empdetail-grid">'+
        '<div class="empdetail-row"><div class="empdetail-label">OB ID</div><div class="empdetail-val">'+esc(c.OB_ID||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Position Type</div><div class="empdetail-val">'+esc(c.POSITION_TYPE||'—')+'</div></div>'+
        '<div class="empdetail-row full"><div class="empdetail-label">Full Name</div><div class="empdetail-val">'+esc(c.FULL_NAME||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Passport No</div><div class="empdetail-val" style="font-family:monospace;font-size:12px">'+esc(c.PASSPORT_NO||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Mobile</div><div class="empdetail-val">'+esc(c.MOBILE||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Visa Status</div><div class="empdetail-val">'+esc(c.VISA_STATUS||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Expected Join</div><div class="empdetail-val">'+esc(c.EXP_JOIN_DATE||'—')+'</div></div>'+
        '<div class="empdetail-row"><div class="empdetail-label">Date Added</div><div class="empdetail-val">'+esc(c.DATE_ADDED||'—')+'</div></div>'+
      '</div>';

    var editBtn = document.getElementById('empdetail-edit-btn');
    if(editBtn){
      editBtn.textContent = '\u270E Edit Candidate';
      editBtn.onclick = function(){
        closeM('m-empdetail');
        OBAgent.openEdit(obId);
      };
    }
    openM('m-empdetail');
  },

  show: function(){
    var q = (document.getElementById('gsearch-input')||{}).value||'';
    if(q.trim()) this._run(q);
  },

  hide: function(){
    var box = document.getElementById('gsearch-results'); if(!box) return;
    box.classList.remove('open');
    box.innerHTML = '';
  },

  clear: function(){
    var inp = document.getElementById('gsearch-input'); if(inp) inp.value='';
    var clr = document.getElementById('gsearch-clear'); if(clr) clr.style.display='none';
    this.hide();
    this._lastQ = '';
  }
};

// Close search on outside click
document.addEventListener('click', function(e){
  var wrap = document.getElementById('gsearch-wrap');
  if(wrap && !wrap.contains(e.target)) GlobalSearch.hide();
});
// Close on Escape
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') GlobalSearch.clear();
});

// ============================================================
// GAS BRIDGE
// ============================================================
var GAS={
  call:function(fn,args,ok,err){
    google.script.run
      .withSuccessHandler(function(r){ if(ok) ok(r); })
      .withFailureHandler(function(e){ toast('Server error: '+(e.message||e),'error'); if(err) err(e); })
      [fn].apply(google.script.run,args||[]);
  },
  loadAll:function(cb){
    GAS.call('loadAllData',[],function(r){
      if(r.master     &&r.master.success)     APP.master     =r.master.data     ||[];
      if(r.deletions  &&r.deletions.success)  APP.deletions  =r.deletions.data  ||[];
      if(r.onboarding &&r.onboarding.success) APP.onboarding =r.onboarding.data ||[];
      if(r.hrDocs     &&r.hrDocs.success)     APP.hrDocs     =r.hrDocs.data     ||[];
      if(r.summary    &&r.summary.success)    APP.summary    =r.summary.data    ||[];
      APP.config=r.config||{}; APP.loaded=true;
      if(cb) cb();
    });
  },
  addEmployee:      function(d,cb){ GAS.call('addEmployee',     [d],cb); },
  updateEmployee:   function(d,cb){ GAS.call('updateEmployee',  [d],cb); },
  deleteEmployee:   function(id,rsn,by,cb){ GAS.call('deleteEmployee',[id,rsn,by],cb); },
  addOnboarding:    function(d,cb){ GAS.call('addOnboarding',   [d],cb); },
  updateOnboarding: function(d,cb){ GAS.call('updateOnboarding',[d],cb); },
  transferToMaster: function(obId,emp,cb){ GAS.call('transferToMaster',[obId,emp],cb); },
  issueHRDoc:       function(d,cb){ GAS.call('issueHRDoc',      [d],cb); },
  saveConfig:            function(cfg,cb){ GAS.call('saveConfig',           [cfg],cb); },
  getActivityLog:        function(cb)    { GAS.call('getActivityLog',        [],cb); },
  getOfferLetterTemplate:function(type,cb){ GAS.call('getOfferLetterTemplate',[type],cb); },
  saveTemplateFileIds:   function(p,s,cb){ GAS.call('saveTemplateFileIds',  [p,s],cb); },
  saveLetterTemplate:    function(t,d,b,cb){ GAS.call('saveLetterTemplate',   [t,d,b],cb); },
  generateAndIssueLetter:function(d,cb)    { GAS.call('generateAndIssueLetter',[d],   cb); }
};

// ============================================================
// LOGGER
// ============================================================
var Logger={
  entries:[],
  write:function(a,act,d,s){ this.entries.unshift({TIMESTAMP:new Date().toLocaleString('en-AE',{hour12:false}),AGENT:a,ACTION:act,DETAIL:d||'',STATUS:s||'SUCCESS'}); this._r(); },
  clear:function(){ this.entries=[]; this._r(); },
  loadFromServer:function(){ GAS.getActivityLog(function(r){ if(r&&r.success){ Logger.entries=r.data||[]; Logger._r(); } }); },
  _r:function(){
    var tb=document.getElementById('log-tbody'); if(!tb) return;
    if(!this.entries.length){ tb.innerHTML='<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--muted)">No logs.</td></tr>'; return; }
    var cm={SUCCESS:'var(--teal)',ERROR:'var(--red)',WARNING:'var(--gold)',INFO:'var(--navy)'};
    tb.innerHTML=this.entries.slice(0,200).map(function(e){
      var c=cm[e.STATUS]||'#888';
      return '<tr><td style="font-family:monospace;font-size:10px;color:var(--muted)">'+esc(e.TIMESTAMP)+'</td><td style="color:var(--navy);font-size:11px;font-weight:700">'+esc(e.AGENT)+'</td><td>'+esc(e.ACTION)+'</td><td style="font-size:11px;color:var(--muted)">'+esc(e.DETAIL)+'</td><td><span class="badge" style="background:'+c+'22;color:'+c+'">'+esc(e.STATUS)+'</span></td></tr>';
    }).join('');
  }
};

// ============================================================
// EMPLOYEE AGENT — lazy load 100/batch
// ============================================================
var EmpAgent={
  _batch:100, _loaded:0, _sort:{col:'NAME',dir:'asc'},
  _isMasterView:function(){
    var v=document.getElementById('view-masterdata'); return v&&v.classList.contains('active');
  },
  _filteredMaster:function(){
    var q  =(document.getElementById('emp-q')    ||{}).value||'';
    var qt =(document.getElementById('emp-tq')   ||{}).value||'';
    var ent=(document.getElementById('emp-ent')  ||{}).value||'';
    var lic=(document.getElementById('emp-lic')  ||{}).value||'';
    var sts=(document.getElementById('emp-sts')  ||{}).value||'';
    var nat=(document.getElementById('emp-nat-f')||{}).value||'';
    var doj=(document.getElementById('emp-doj-f')||{}).value||'';
    q=q.toLowerCase(); qt=qt.toLowerCase();
    var list=APP.master.filter(function(r){
      if(q  && ![(r.NAME||''),(r.ID||''),(r['PASSPORT NO']||'')].some(function(v){ return v.toLowerCase().indexOf(q)>=0; })) return false;
      if(qt && ![(r.NAME||''),(r.ID||''),(r['EID NO']||'')].some(function(v){ return v.toLowerCase().indexOf(qt)>=0; })) return false;
      if(ent && normEnt(r.ENTITY)!==ent) return false;
      if(lic && r['LIC AUTH']!==lic) return false;
      if(sts && r.STATUS!==sts) return false;
      if(nat && (r.NATIONALITY||'').toLowerCase().indexOf(nat.toLowerCase())<0) return false;
      if(doj && (r['DATE OF JOIN']||'').indexOf(doj)<0) return false;
      return true;
    });
    var sc=this._sort.col, sd=this._sort.dir;
    list.sort(function(a,b){ var av=String(a[sc]||'').toUpperCase(),bv=String(b[sc]||'').toUpperCase(); return sd==='asc'?av.localeCompare(bv):bv.localeCompare(av); });
    return list;
  },
  _filteredActive:function(){
    var q  =(document.getElementById('emp-q2')  ||{}).value||'';
    var ent=(document.getElementById('emp-ent2')||{}).value||'';
    var lic=(document.getElementById('emp-lic2')||{}).value||'';
    q=q.toLowerCase();
    var list=getActiveEmployees().filter(function(r){
      if(q  && ![(r.NAME||''),(r.ID||''),(r['PASSPORT NO']||'')].some(function(v){ return v.toLowerCase().indexOf(q)>=0; })) return false;
      if(ent && normEnt(r.ENTITY)!==ent) return false;
      if(lic && r['LIC AUTH']!==lic) return false;
      return true;
    });
    var sc=this._sort.col, sd=this._sort.dir;
    list.sort(function(a,b){ var av=String(a[sc]||'').toUpperCase(),bv=String(b[sc]||'').toUpperCase(); return sd==='asc'?av.localeCompare(bv):bv.localeCompare(av); });
    return list;
  },
  render:function(reset){
    var licB=function(l){ var m={PSBD:'bp',SIRA:'bs',NIL:'bn',OTHER:'bo'}; return '<span class="badge '+(m[l]||'bn')+'">'+esc(l||'NIL')+'</span>'; };
    var makeRow=function(r,i){
      var id=esc(r.ID||''), nm=esc(r.NAME||'—');
      return '<tr>'+
        '<td style="color:var(--muted2);font-size:10px">'+(i+1)+'</td>'+
        '<td><span class="pph" title="PP: '+esc(r['PASSPORT NO']||'N/A')+'">'+id+'</span></td>'+
        '<td style="font-weight:600">'+nm.substring(0,26)+(nm.length>26?'&hellip;':'')+'</td>'+
        '<td>'+licB(r['LIC AUTH']||'NIL')+'</td>'+
        '<td class="eid-cell" id="eid-cell-'+id+'"><span id="eid-text-'+id+'" style="cursor:pointer" title="Click to edit" onclick="EmpAgent.editEID(\''+id+'\')">'+esc(r['EID NO']||'—')+'</span></td>'+
        '<td><div class="act-btns">'+
          '<button class="btn btn-secondary btn-icon btn-sm" data-action="edit-emp" data-id="'+id+'" title="Edit">&#9998;</button>'+
          '<button class="btn btn-danger btn-icon btn-sm" data-action="del-emp" data-id="'+id+'" data-name="'+nm+'" title="Delete">&#128465;</button>'+
        '</div></td></tr>';
    };
    var empty='<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--muted)">No records found.</td></tr>';
    var active=getActiveEmployees();
    var nb=document.getElementById('nb-emp'); if(nb) nb.textContent=active.length;

    // — Employee Register: all master data, no pagination —
    var tb=document.getElementById('emp-tbody');
    if(tb){
      var mlist=this._filteredMaster(), mt=mlist.length;
      var cnt=document.getElementById('emp-cnt'); if(cnt) cnt.textContent=mt+' of '+APP.master.length;
      tb.innerHTML=mt?mlist.map(makeRow).join(''):empty;
    }

    // — Active Employees: filtered active, with pagination —
    var tb2=document.getElementById('emp-tbody2');
    if(tb2){
      var alist=this._filteredActive(), at=alist.length;
      if(reset) this._loaded=0;
      var batch=Math.min(this._loaded+this._batch, at);
      this._loaded=batch;
      var cnt2=document.getElementById('emp-cnt2'); if(cnt2) cnt2.textContent=at+' of '+active.length;
      var rows=at?alist.slice(0,batch).map(makeRow).join(''):empty;

  loadMore:function(){
    var list=this._filteredActive(), t=list.length;
    var newBatch=Math.min(this._loaded+this._batch,t);
    this._loaded=newBatch;
    var tb2=document.getElementById('emp-tbody2'); if(!tb2) return;
    var last=tb2.querySelector('.load-more-row'); if(last) last.remove();
    var licB=function(l){ var m={PSBD:'bp',SIRA:'bs',NIL:'bn',OTHER:'bo'}; return '<span class="badge '+(m[l]||'bn')+'">'+esc(l||'NIL')+'</span>'; };
    var prev=this._loaded-this._batch;
    var rows=list.slice(prev,newBatch).map(function(r,i){
      var id=esc(r.ID||''), nm=esc(r.NAME||'—');
      return '<tr>'+
        '<td style="color:var(--muted2);font-size:10px">'+(prev+i+1)+'</td>'+
        '<td><span class="pph" title="PP: '+esc(r['PASSPORT NO']||'N/A')+'">'+id+'</span></td>'+
        '<td style="font-weight:600">'+nm.substring(0,26)+(nm.length>26?'&hellip;':'')+'</td>'+
        '<td>'+licB(r['LIC AUTH']||'NIL')+'</td>'+
        '<td class="eid-cell" id="eid-cell-'+id+'"><span id="eid-text-'+id+'" style="cursor:pointer" onclick="EmpAgent.editEID(\''+id+'\')">'+esc(r['EID NO']||'—')+'</span></td>'+
        '<td><div class="act-btns">'+
          '<button class="btn btn-secondary btn-icon btn-sm" data-action="edit-emp" data-id="'+id+'" title="Edit">&#9998;</button>'+
          '<button class="btn btn-danger btn-icon btn-sm" data-action="del-emp" data-id="'+id+'" data-name="'+nm+'" title="Delete">&#128465;</button>'+
        '</div></td></tr>';
    }).join('');
    if(newBatch<t) rows+='<tr class="load-more-row"><td colspan="6"><button class="btn btn-secondary" onclick="EmpAgent.loadMore()" style="width:100%">&#8595; Load more ('+t+' total, showing '+newBatch+')</button></td></tr>';

  },
  sortBy:function(col){
    if(this._sort.col===col) this._sort.dir=this._sort.dir==='asc'?'desc':'asc';
    else{ this._sort.col=col; this._sort.dir='asc'; }
    // update sort indicators
    document.querySelectorAll('.sort-btn').forEach(function(b){ b.classList.remove('active'); b.textContent='&#8597;'; });
    var btn=document.querySelector('.sort-btn[data-col="'+col+'"]');

    var name =document.getElementById('ef-name').value.trim();
    var pp   =document.getElementById('ef-pp').value.trim();
    var eid  =document.getElementById('ef-eid').value.trim();
    if(!id)  { toast('Employee ID required','error'); return; }
    if(!name){ toast('Full Name required','error'); return; }
    if(!pp)  { toast('Passport No required','error'); return; }

// ============================================================
// ONBOARDING AGENT — real-time bind, correct workflow

var OBAgent={
  _pending:function(){ return APP.onboarding.filter(function(c){ return c.STATUS==='Pending'; }).length; },
  _filtered:function(){
    var q=(document.getElementById('ob-q')   ||{}).value||'';

    var t=(document.getElementById('ob-type')||{}).value||'';

      if(q&&![(r.FULL_NAME||''),(r.PASSPORT_NO||'')].some(function(v){ return v.toLowerCase().indexOf(q)>=0; })) return false;
      if(s&&r.STATUS!==s) return false;
      if(t&&r.POSITION_TYPE!==t) return false;
      return true;
    });
  },
  render:function(){
    var tb=document.getElementById('ob-tbody'); if(!tb) return;
    var p=this._pending();

    var sB=function(s){ var m={Pending:'badge bo',Transferred:'badge bg2',Cancelled:'badge bn'}; return '<span class="'+(m[s]||'badge bn')+'">'+esc(s||'—')+'</span>'; };
    var tB=function(t){ return t==='PSBD'?'<span class="badge bp">PSBD</span>':'<span class="badge bs">SIRA</span>'; };

      var obid=esc(r.OB_ID||''), nm=esc(r.FULL_NAME||'—');

      var trBtn=canAct?'<button class="btn btn-primary btn-sm" data-action="transfer" data-obid="'+obid+'" data-name="'+nm+'" title="Transfer to Master">&rarr;</button>':'';
      var olBtn=canAct?'<button class="btn btn-gold btn-sm" data-action="gen-ol" data-obid="'+obid+'" data-name="'+nm+'" data-type="'+esc(r.POSITION_TYPE||'PSBD')+'" data-pp="'+esc(r.PASSPORT_NO||'')+'" title="Generate Offer Letter">&#128196;</button>':'';

    }).join('');
  },
  resetF:function(){

  // STEP 1: Collect candidate info (name, passport, mobile, visa, joining date)
  openAdd:function(){

    document.getElementById('obf-visa').value='Inside UAE';
    document.getElementById('obf-join').value=today();
    openM('m-ob');
  },
  openEdit:function(obId){
    var c=APP.onboarding.find(function(r){ return r.OB_ID===obId; });
    if(!c){ toast('Not found','error'); return; }
    document.getElementById('m-ob-ttl').textContent='Edit Candidate';
    document.getElementById('obf-editid').value=obId;
    document.getElementById('obf-name').value  =c.FULL_NAME||'';
    document.getElementById('obf-pp').value    =c.PASSPORT_NO||'';
    document.getElementById('obf-type').value  =c.POSITION_TYPE||'PSBD';
    document.getElementById('obf-mob').value   =c.MOBILE||'';
    document.getElementById('obf-visa').value  =c.VISA_STATUS||'Inside UAE';
    document.getElementById('obf-join').value  =c.EXP_JOIN_DATE||'';
    document.getElementById('obf-notes').value =c.NOTES||'';
    openM('m-ob');
  },
  // STEP 2: Save to Onboarding Sheet
  save:function(){
    var editId=document.getElementById('obf-editid').value;
    var name  =document.getElementById('obf-name').value.trim();
    var pp    =document.getElementById('obf-pp').value.trim();
    if(!name){ toast('Full Name required','error'); return; }
    if(!pp)  { toast('Passport No required','error'); return; }
    if(!editId&&APP.onboarding.some(function(c){ return c.PASSPORT_NO===pp&&c.STATUS!=='Cancelled'; })){ toast('Candidate already exists','error'); return; }
    if(!editId&&APP.master.some(function(e){ return e['PASSPORT NO']===pp; })){ toast('Passport No in Master Data','error'); return; }
    var type =document.getElementById('obf-type').value;
    var mob  =document.getElementById('obf-mob').value.trim();
    var visa =document.getElementById('obf-visa').value;
    var join =document.getElementById('obf-join').value;
    var notes=document.getElementById('obf-notes').value.trim();
    if(editId){
      var data={OB_ID:editId,FULL_NAME:name.toUpperCase(),PASSPORT_NO:pp.toUpperCase(),POSITION_TYPE:type,MOBILE:mob,VISA_STATUS:visa,EXP_JOIN_DATE:join,DATE_ADDED:'',STATUS:'Pending',NOTES:notes};
      GAS.updateOnboarding(data,function(result){
        if(!result||!result.success){ toast('Error: '+(result?result.error:'Unknown'),'error'); return; }
        var c=APP.onboarding.find(function(r){ return r.OB_ID===editId; });
        if(c) Object.assign(c,data);
        toast('Updated: '+name,'success');
        closeM('m-ob'); OBAgent.render();
      });
    } else {
      var obId=genId('OB');
      var newRec={OB_ID:obId,FULL_NAME:name.toUpperCase(),PASSPORT_NO:pp.toUpperCase(),POSITION_TYPE:type,MOBILE:mob,VISA_STATUS:visa,EXP_JOIN_DATE:join,DATE_ADDED:today(),STATUS:'Pending',NOTES:notes};
      GAS.addOnboarding(newRec,function(result){
        if(!result||!result.success){ toast('Error: '+(result?result.error:'Unknown'),'error'); return; }
        APP.onboarding.push(newRec); // real-time bind
        toast('Candidate saved. You can now issue Offer Letter.','success');
        closeM('m-ob'); OBAgent.render();
        // STEP 3: Prompt to issue offer letter
        setTimeout(function(){
          if(confirm('Candidate added. Generate Offer Letter now?')){ OBAgent._openOLForCandidate(newRec); }
        },400);
      });
    }
  },
  // STEP 3: Offer letter from existing candidate data
  _openOLForCandidate:function(cand){
    document.getElementById('ol-name').value=(cand.FULL_NAME||'').toUpperCase();
    document.getElementById('ol-pp').value  =(cand.PASSPORT_NO||'').toUpperCase();
    document.getElementById('ol-date').textContent=todayDisplay();
    document.getElementById('ol-msg').textContent='';
    selectOL(cand.POSITION_TYPE||'PSBD');
    openM('m-ol');
  },
  openOLForId:function(obId,name,type,pp){
    var cand={FULL_NAME:name,PASSPORT_NO:pp,POSITION_TYPE:type};
    this._openOLForCandidate(cand);
  },
  openTransfer:function(obId,name){
    document.getElementById('trf-obid').value=obId;
    document.getElementById('tr-name').textContent=name;
    document.getElementById('trf-id').value   ='';
    document.getElementById('trf-ent').value  ='USG';
    document.getElementById('trf-join').value =today();
    document.getElementById('trf-desig').value='Security Guard';
    openM('m-tr');
  },
  confirmTransfer:function(){
    var obId =document.getElementById('trf-obid').value;
    var empId=document.getElementById('trf-id').value.trim();
    var ent  =document.getElementById('trf-ent').value;
    var join =document.getElementById('trf-join').value;
    var desig=document.getElementById('trf-desig').value.trim()||'Security Guard';
    if(!empId){ toast('Employee ID required','error'); return; }
    if(!ent)  { toast('Entity required','error'); return; }

    var cand=APP.onboarding.find(function(c){ return c.OB_ID===obId; });
    if(!cand){ toast('Candidate not found','error'); return; }
    var empData={ID:empId,NAME:cand.FULL_NAME,VISA:'ABU DHABI',STATUS:'ABU DHABI',ENTITY:ent,'LIC AUTH':cand.POSITION_TYPE==='PSBD'?'PSBD':'SIRA',DESIGNATION:desig,'DATE OF JOIN':join,NATIONALITY:'','BIRTH DATE':'','PASSPORT NO':cand.PASSPORT_NO,'EID NO':'',AGE:'',Days:''};
    GAS.transferToMaster(obId,empData,function(result){
      if(!result||!result.success){ toast('Error: '+(result?result.error:'Unknown'),'error'); return; }
      APP.master.push(empData);
      cand.STATUS='Transferred';
      toast('Transferred: '+cand.FULL_NAME,'success');
      closeM('m-tr'); OBAgent.render(); EmpAgent.render(true); DashAgent.refresh();
    });
  },
  cancel:function(obId){
    var c=APP.onboarding.find(function(r){ return r.OB_ID===obId; }); if(!c) return;

    var data=Object.assign({},c,{STATUS:'Cancelled'});

      if(!result||!result.success){ toast('Error','error'); return; }
      c.STATUS='Cancelled';
      toast(c.FULL_NAME+' cancelled','info');
      OBAgent.render();
    });
  }
};

    var key=type?type.toUpperCase().replace(/[^A-Z0-9]/g,'_'):'';
    var hasTemplate=!!(key&&(APP.config['LTEMPL_'+key+'_DRIVE']||APP.config['LTEMPL_'+key+'_BODY']));
    var hint=document.getElementById('ltf-pdf-hint'); if(hint) hint.style.display=(type&&hasTemplate)?'':'none';
    var btn=document.querySelector('#m-ltr .btn-gold');
    if(btn) btn.textContent=hasTemplate?'Generate & Issue':'Issue Letter';
  },
  autofill:function(){
    var id=document.getElementById('ltf-empid').value.trim();
    var emp=getActiveEmployees().find(function(e){ return e.ID===id; });
    var set=function(elId,val){ var el=document.getElementById(elId); if(el) el.value=val||''; };
    if(emp){
      set('ltf-name',   emp.NAME||'');
      set('ltf-des',    emp['DESIGNATION']||'');
      set('ltf-pp',     emp['PASSPORT NO']||'');
      set('ltf-entity', emp.ENTITY||'');
      set('ltf-doj',    emp['DATE OF JOIN']||'');
    } else {
      set('ltf-name',   id?'(not found)':'');
      set('ltf-des',''); set('ltf-pp',''); set('ltf-entity',''); set('ltf-doj','');
    }
  },
  issue:function(){
    var type =document.getElementById('ltf-type').value;
    var empId=document.getElementById('ltf-empid').value.trim();
    if(!type)  { toast('Select letter type first','error'); return; }
    if(!empId) { toast('Employee ID required','error'); return; }
    var get=function(id){ var el=document.getElementById(id); return el?el.value.trim():''; };
    var ref='HR-'+Date.now().toString().slice(-8);
    var data={
      REF_NO:      ref,
      EMP_ID:      empId,
      EMP_NAME:    get('ltf-name'),
      LETTER_TYPE: type,
      ISSUE_DATE:  get('ltf-date'),
      ISSUED_BY:   get('ltf-by'),
      NOTES:       get('ltf-notes'),
      SALARY:      get('ltf-sal'),
      DESIGNATION: get('ltf-des'),
      PASSPORT_NO: get('ltf-pp'),
      ENTITY:      get('ltf-entity'),
      DATE_OF_JOIN:get('ltf-doj')
    };
    var key=type.toUpperCase().replace(/[^A-Z0-9]/g,'_');
    var hasTemplate=!!(APP.config['LTEMPL_'+key+'_DRIVE']||APP.config['LTEMPL_'+key+'_BODY']);
    var btn=document.querySelector('#m-ltr .btn-gold');
    if(btn){ btn.disabled=true; btn.textContent='Processing...'; }
    GAS.generateAndIssueLetter(data,function(result){
      if(btn){ btn.disabled=false; btn.textContent=hasTemplate?'Generate & Issue':'Issue Letter'; }
      if(!result||!result.success){ toast('Error: '+(result?result.error:'Unknown'),'error'); return; }
      APP.hrDocs.unshift({REF_NO:ref,EMP_ID:empId,EMP_NAME:data.EMP_NAME,LETTER_TYPE:type,ISSUE_DATE:data.ISSUE_DATE,ISSUED_BY:data.ISSUED_BY,NOTES:data.NOTES});
      if(result.pdf){
        try{
          var bytes=Uint8Array.from(atob(result.pdf),function(c){ return c.charCodeAt(0); });
          var blob=new Blob([bytes],{type:'application/pdf'});
          var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
          a.download=type.replace(/\s+/g,'-')+'_'+empId+'_'+ref+'.pdf';
          document.body.appendChild(a); a.click();
          setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(a.href); },1000);
        }catch(e2){}
      }
      toast(type+' issued ('+ref+')'+(result.pdf?' — PDF downloaded':''),'success');
      closeM('m-ltr'); LtrAgent.render();
    });
  },
  delEntry:function(ref){ APP.hrDocs=APP.hrDocs.filter(function(l){ return l.REF_NO!==ref; }); toast('Removed locally','warning'); this.render(); }
};

// ============================================================
// OFFER LETTER — Uses REAL PSBD / SIRA templates from Google Drive
// EXACT fill coordinates (verified via pdfplumber baseline extraction):
//   Page size: 595.32 x 841.92  (A4)
//   pdf-lib uses bottom-left origin
//
//   DATE  value: x=453.000, y=733.736  (Helvetica Regular 10pt)
//   NAME  value: x=144.860, y=715.116  (Helvetica Bold 10pt)
//   POS   value: x=144.860, y=699.876  (Helvetica Bold 10pt)
//   PP NO value: x=370.000, y=699.876  (Helvetica Bold 10pt)
//
//   Both PSBD & SIRA templates share identical field coordinates.
//   Only salary (7) and location (8) differ between templates.
// ============================================================
// ============================================================
// OFFER LETTER — EMBEDDED templates, exact PyMuPDF coordinates
// Templates are base64 strings served from OfferLetterHelper.gs
// Fetched once, cached in memory for instant re-use
//
// EXACT COORDINATES (PyMuPDF span["origin"] method):
//   DATE  → x=453.520  y=733.740  Helvetica Regular 10.020pt
//   NAME  → x=144.860  y=715.120  Helvetica Bold    10.020pt
//   POS   → x=144.860  y=699.880  Helvetica Bold    10.020pt
//   PP NO → x=376.000  y=699.880  Helvetica Bold    10.020pt
//   (y is pdf-lib bottom-left: y_pdflib = 841.92 - y_mupdf)
// ============================================================
var olType = 'PSBD';
var OL_CACHE = {}; // {PSBD: base64str, SIRA: base64str}

function selectOL(t){
  olType = t;
  document.getElementById('ol-psbd').className = 'type-card'+(t==='PSBD'?' active-psbd':'');
  document.getElementById('ol-sira').className = 'type-card'+(t==='SIRA'?' active-sira':'');
  document.getElementById('ol-pos').textContent = t==='PSBD'?'SECURITY GUARD':'SECURITY GUARD - SIRA';
  var btn = document.getElementById('ol-btn');
  btn.className = t==='PSBD'?'btn btn-gold':'btn btn-primary';
  btn.textContent = 'Download '+t+' Offer Letter';
}

function openOLModal(){
  document.getElementById('ol-name').value = '';
  document.getElementById('ol-pp').value   = '';
  document.getElementById('ol-date').textContent = todayDisplay();
  document.getElementById('ol-msg').textContent  = '';
  selectOL('PSBD');
  openM('m-ol');
}

function downloadOL(){
  var name = document.getElementById('ol-name').value.trim();
  var pp   = document.getElementById('ol-pp').value.trim();
  var msg  = document.getElementById('ol-msg');
  if(!name){ msg.style.color='var(--red)'; msg.textContent='Enter full name.'; return; }
  if(!pp)  { msg.style.color='var(--red)'; msg.textContent='Enter passport number.'; return; }

  var btn = document.getElementById('ol-btn');
  btn.disabled = true;
  msg.style.color = 'var(--teal)';

  // DD/MM/YYYY
  var now = new Date();
  var dateStr = ('0'+now.getDate()).slice(-2)+'/'+('0'+(now.getMonth()+1)).slice(-2)+'/'+now.getFullYear();

  // Use cache if available — instant
  if(OL_CACHE[olType]){
    msg.textContent = 'Generating...';
    btn.textContent = 'Generating...';
    _fillAndDownload(OL_CACHE[olType], name, pp, dateStr, msg, btn);
    return;
  }

  // Fetch from GAS (embedded in OfferLetterHelper.gs — very fast, no Drive latency)
  msg.textContent = 'Loading template...';
  btn.innerHTML   = '<span class="spin-sm"></span> Loading...';

  GAS.call('getOfferLetterTemplate', [olType], function(result){
    if(!result || !result.success){
      btn.disabled = false; btn.textContent = 'Download '+olType+' Offer Letter';
      msg.style.color = 'var(--red)';
      msg.textContent = 'Error: '+(result ? result.error : 'Could not load template');
      return;
    }
    OL_CACHE[olType] = result.data; // cache for instant re-use
    msg.textContent  = 'Filling fields...';
    btn.textContent  = 'Filling fields...';
    _fillAndDownload(result.data, name, pp, dateStr, msg, btn);
  });
}

// ============================================================
// FILL TEMPLATE — pdf-lib overlays 4 fields on USG template
// ============================================================
function _fillAndDownload(templateB64, name, pp, dateStr, msg, btn){
  // base64 → Uint8Array
  var binary = atob(templateB64);
  var bytes  = new Uint8Array(binary.length);
  for(var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

  PDFLib.PDFDocument.load(bytes).then(function(pdfDoc){
    var page = pdfDoc.getPages()[0];

    return Promise.all([
      pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold),
      pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica)
    ]).then(function(fonts){
      var fBold = fonts[0];
      var fReg  = fonts[1];
      var black = PDFLib.rgb(0, 0, 0);
      var SZ    = 10.020; // matches Tahoma 10.020pt in original

      // ── POSITION label (SIRA adds "- SIRA" suffix) ──
      var posText = (olType === 'SIRA') ? 'SECURITY GUARD - SIRA' : 'SECURITY GUARD';

      // DATE  → Helvetica Regular, x=453.520, y=733.740
      page.drawText(dateStr, {
        x: 453.520, y: 733.740, size: SZ, font: fReg, color: black
      });

      // NAME  → Helvetica Bold,    x=144.860, y=715.120
      page.drawText(name.toUpperCase(), {
        x: 144.860, y: 715.120, size: SZ, font: fBold, color: black
      });

      // POS   → Helvetica Bold,    x=144.860, y=699.880
      page.drawText(posText, {
        x: 144.860, y: 699.880, size: SZ, font: fBold, color: black
      });

      // PP NO → Helvetica Bold,    x=376.000, y=699.880
      page.drawText(pp.toUpperCase(), {
        x: 376.000, y: 699.880, size: SZ, font: fBold, color: black
      });

      return pdfDoc.save();
    });

  }).then(function(outBytes){
    var blob = new Blob([outBytes], {type:'application/pdf'});
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href   = url;
    a.download = 'OfferLetter_' + olType + '_' + name.replace(/\s+/g,'_') + '.pdf';
    a.click();
    URL.revokeObjectURL(url);

    btn.disabled = false;
    btn.textContent = 'Download ' + olType + ' Offer Letter';
    msg.textContent = 'Downloaded successfully!';
    Logger.write('OfferLetterAgent', 'GENERATE', olType + ' | ' + name + ' | ' + pp);

    // Log to HR Docs locally
    APP.hrDocs.unshift({
      REF_NO: 'OL-'+Date.now().toString().slice(-8),
      EMP_ID: 'ONBOARD', EMP_NAME: name,
      LETTER_TYPE: 'Offer Letter', ISSUE_DATE: today(),
      ISSUED_BY: APP.config.hr_officer||'HR',
      NOTES: olType + ' | PP: ' + pp
    });

  }).catch(function(e){
    btn.disabled = false;
    btn.textContent = 'Download ' + olType + ' Offer Letter';
    msg.style.color = 'var(--red)';
    msg.textContent = 'PDF Error: ' + e.message;
    console.error('Offer letter error:', e);
  });
}

// ============================================================
// AGENT MANAGER — 15 min refresh, no refresh during editing
// ============================================================
var AgentManager={
  _lastSync:null, _timerInterval:null,

  init:function(){
    var self=this;
    this._months();
    this._showLoader(true);
    this._startTimer();
    // 15 MINUTE auto-refresh — skip if editing
    setInterval(function(){
      if(EDITING){ return; } // do NOT refresh during data entry
      self.refreshAll();
    }, 15*60*1000);
    GAS.loadAll(function(){
      self._showLoader(false);
      self._lastSync=Date.now();
      EmpAgent.render(true);
      OBAgent.render();
      LtrAgent.render();
      DashAgent.refresh();
      CFG.loadUI();
      var sl=document.getElementById('sync-label');
      if(sl) sl.textContent='Data Synced via Google';
      toast('Dashboard loaded - '+getActiveEmployees().length.toLocaleString()+' active employees','success');
    });
  },

  _startTimer:function(){
    var self=this;
    if(this._timerInterval) clearInterval(this._timerInterval);
    this._timerInterval=setInterval(function(){
      if(!self._lastSync) return;
      var elapsed=Math.floor((Date.now()-self._lastSync)/1000);
      var m=Math.floor(elapsed/60), s=elapsed%60;
      var display=m>0?m+'m '+String(s).padStart(2,'0')+'s ago':String(s).padStart(2,'0')+'s ago';
      var el=document.getElementById('sync-timer'); if(el) el.textContent=display;
    },1000);
  },

  refreshAll:function(){
    var self=this;
    var sl=document.getElementById('sync-label'); if(sl) sl.textContent='Syncing...';
    GAS.loadAll(function(){
      self._lastSync=Date.now();
      EmpAgent.render(true); OBAgent.render(); LtrAgent.render(); DashAgent.refresh();
      var sl2=document.getElementById('sync-label'); if(sl2) sl2.textContent='Connected to live data via Google';
      var el=document.getElementById('sync-timer'); if(el) el.textContent='just now';
      toast('Data refreshed','info');
    });
  },

  _months:function(){
    var sel=document.getElementById('rpt-month'); if(!sel) return;
    var mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var now=new Date();
    for(var i=0;i<12;i++){
      var d=new Date(now.getFullYear(),now.getMonth()-i,1);
      var opt=document.createElement('option');
      opt.value=opt.textContent=mn[d.getMonth()]+' '+d.getFullYear();
      sel.appendChild(opt);
    }
  },

  _showLoader:function(show){
    var loader=document.getElementById('main-loader');
    var content=document.getElementById('main-content');
    if(loader)  loader.style.display=show?'flex':'none';
    if(content) content.style.display=show?'none':'block';
  }
};

// ============================================================
// NAVIGATION
// ============================================================
function navigate(view){
  document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
  document.querySelectorAll('.sb-item').forEach(function(i){ i.classList.remove('active'); });
  var v=document.getElementById('view-'+view); if(v) v.classList.add('active');
  var s=document.querySelector('[data-view="'+view+'"]'); if(s) s.classList.add('active');
  var tt=document.getElementById('topbar-title');
  var titles={dashboard:'Dashboard',masterdata:'EMPLOYEE RECORD',employees:'Active Employees',onboarding:'Onboarding Pipeline',letters:'HR Letters',reports:'Monthly Report',logs:'Activity Logs',setup:'System Configuration'};
  if(tt) tt.textContent=titles[view]||view;
  var cta=document.getElementById('top-cta');
  if(cta){
    if(view==='masterdata'||view==='employees'){ cta.textContent='+ Add Employee'; cta.onclick=function(){ EmpAgent.openAdd(); }; }
    else if(view==='onboarding'){ cta.textContent='+ Add Candidate'; cta.onclick=function(){ OBAgent.openAdd(); }; }
    else if(view==='letters'){ cta.textContent='Issue Letter'; cta.onclick=function(){ LtrAgent.openIssue(); }; }
    else{ cta.textContent='Offer Letter'; cta.onclick=openOLModal; }
  }
  if(view==='masterdata'||view==='employees') EmpAgent.render(true);
  if(view==='logs') Logger.loadFromServer();
}

// ============================================================
// EVENT DELEGATION
// ============================================================
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-action]'); if(!t) return;
  var act=t.dataset.action;
  if     (act==='edit-emp')  EmpAgent.openEdit(t.dataset.id);
  else if(act==='del-emp')   EmpAgent.openDelete(t.dataset.id,t.dataset.name);
  else if(act==='transfer')  OBAgent.openTransfer(t.dataset.obid,t.dataset.name);
  else if(act==='edit-ob')   OBAgent.openEdit(t.dataset.obid);
  else if(act==='cancel-ob') OBAgent.cancel(t.dataset.obid);
  else if(act==='gen-ol')    OBAgent.openOLForId(t.dataset.obid,t.dataset.name,t.dataset.type,t.dataset.pp);
  else if(act==='del-ltr')   LtrAgent.delEntry(t.dataset.ref);
});

window.addEventListener('DOMContentLoaded',function(){ AgentManager.init(); });
</script>
