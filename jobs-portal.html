<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Careers — United Group Holding</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Tahoma,Arial,sans-serif;background:#f0f2f5;color:#1a2540;min-height:100vh}
  .header{background:linear-gradient(135deg,#1e4799,#0d2a5e);color:#fff;padding:28px 40px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,.25)}
  .header-brand{display:flex;align-items:center;gap:14px}
  .header-brand h1{font-size:20px;font-weight:700;letter-spacing:.03em}
  .header-brand p{font-size:12px;opacity:.75;margin-top:2px}
  .header-tag{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);padding:5px 14px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.04em}
  .container{max-width:900px;margin:0 auto;padding:32px 20px}
  .page-title{font-size:24px;font-weight:700;color:#1e4799;margin-bottom:4px}
  .page-sub{color:#6b7a99;font-size:13px;margin-bottom:28px}
  .job-grid{display:grid;gap:14px}

  /* Job card */
  .job-card{background:#fff;border-radius:12px;border:1px solid #e2e8f0;padding:20px 24px;transition:box-shadow .15s,border-color .15s}
  .job-card:hover{box-shadow:0 4px 18px rgba(30,71,153,.1);border-color:#1e4799}
  .job-card-main{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .job-info h3{font-size:15px;font-weight:700;color:#1a2540;margin-bottom:5px}
  .job-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .job-tag{font-size:10.5px;background:#f0f4ff;color:#1e4799;border:1px solid #c7d6f5;padding:2px 9px;border-radius:10px;font-weight:600}
  .job-tag.type{background:#fff8e6;color:#b87000;border-color:#f5d98a}
  .job-tag.entity{background:#e8f8f2;color:#137843;border-color:#a8dfc4}
  .job-tag.salary{background:#f0fff8;color:#0d6e4a;border-color:#86efcb;font-weight:700}
  .apply-btn{background:linear-gradient(135deg,#b87000,#8a5200);color:#fff;border:none;padding:9px 20px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:opacity .14s;flex-shrink:0}
  .apply-btn:hover{opacity:.88}

  /* Description section */
  .job-desc-bar{margin-top:12px;padding-top:12px;border-top:1px solid #f0f2f5;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .desc-preview{font-size:12px;color:#4a5568;line-height:1.5;flex:1}
  .desc-toggle{background:none;border:none;color:#1e4799;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;padding:2px 6px;border-radius:4px;text-decoration:underline;flex-shrink:0}
  .desc-toggle:hover{background:#f0f4ff}
  .job-desc-full{display:none;margin-top:10px;font-size:12px;color:#374151;line-height:1.6;background:#f8faff;border-radius:8px;padding:12px 14px;border:1px solid #e2eaf8}
  .job-desc-full h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#1e4799;margin-bottom:6px;margin-top:10px}
  .job-desc-full h4:first-child{margin-top:0}
  .job-desc-full p{margin:0;white-space:pre-line}

  /* Misc */
  .empty{text-align:center;padding:60px 20px;color:#6b7a99}
  .empty .icon{font-size:40px;margin-bottom:14px;opacity:.5}
  .loader{text-align:center;padding:60px 20px;color:#1e4799;font-size:13px}

  /* Overlay / modal */
  .overlay{position:fixed;inset:0;background:rgba(10,20,50,.55);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
  .overlay.show{display:flex}
  .form-card{background:#fff;border-radius:14px;max-width:580px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .form-hdr{background:linear-gradient(135deg,#1e4799,#0d2a5e);color:#fff;padding:18px 24px;border-radius:14px 14px 0 0;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0}
  .form-hdr h2{font-size:15px;font-weight:700}
  .form-hdr .job-ref{font-size:11px;opacity:.75;margin-top:3px}
  .close-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .14s;flex-shrink:0}
  .close-btn:hover{background:rgba(255,255,255,.25)}
  .form-body{padding:20px 24px}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .frow.full{grid-template-columns:1fr}
  .fg{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
  .fg label{font-size:11px;font-weight:700;color:#4a5568;text-transform:uppercase;letter-spacing:.04em}
  .fg input,.fg textarea,.fg select{border:1.5px solid #e2e8f0;border-radius:7px;padding:8px 11px;font-size:12.5px;font-family:inherit;color:#1a2540;background:#fafbfc;outline:none;transition:border-color .14s}
  .fg input:focus,.fg textarea:focus,.fg select:focus{border-color:#1e4799;background:#fff}
  .fg textarea{resize:vertical;min-height:72px}
  .req{color:#e53e3e;margin-left:2px}

  /* PDF file upload field */
  .file-upload-wrap{border:1.5px dashed #c7d6f5;border-radius:7px;padding:10px 14px;background:#f8faff;transition:border-color .14s;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .file-upload-wrap:hover{border-color:#1e4799}
  .file-upload-wrap.has-file{border-color:#22c55e;background:#f0fdf4}
  .file-upload-input{position:absolute;opacity:0;width:0;height:0}
  .file-upload-label{font-size:12px;color:#6b7a99;cursor:pointer;flex:1}
  .file-upload-label.selected{color:#15803d;font-weight:600}
  .file-choose-btn{background:#1e4799;color:#fff;border:none;padding:5px 12px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
  .file-size-hint{font-size:10px;color:#9ca3af;margin-top:3px}
  .upload-progress{font-size:11px;color:#1e4799;font-weight:600;margin-top:4px;display:none}

  .form-ftr{padding:14px 24px 20px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid #f0f2f5}
  .btn-cancel{background:#f0f2f5;color:#4a5568;border:none;padding:9px 18px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer}
  .btn-submit{background:linear-gradient(135deg,#1e4799,#0d2a5e);color:#fff;border:none;padding:9px 22px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;transition:opacity .14s}
  .btn-submit:hover{opacity:.88}
  .btn-submit:disabled{opacity:.55;cursor:not-allowed}
  .success-wrap{text-align:center;padding:40px 24px}
  .success-icon{font-size:48px;margin-bottom:16px}
  .success-wrap h3{font-size:18px;font-weight:700;color:#137843;margin-bottom:8px}
  .success-wrap p{font-size:13px;color:#6b7a99;line-height:1.6}
  .err{color:#e53e3e;font-size:11px;margin-top:3px;display:none}
  @media(max-width:600px){.job-card-main{flex-direction:column;align-items:flex-start}.apply-btn{width:100%}.frow{grid-template-columns:1fr}.header{padding:18px 20px}}
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <div>
      <h1>United Group Holding</h1>
      <p>Human Resources — Career Opportunities</p>
    </div>
  </div>
  <div class="header-tag">We Are Hiring</div>
</div>

<div class="container">
  <div class="page-title">Open Positions</div>
  <div class="page-sub">Join our growing team. Explore current opportunities and apply directly below.</div>
  <div class="job-grid" id="job-list">
    <div class="loader">Loading available positions...</div>
  </div>
</div>

<!-- Application Overlay -->
<div class="overlay" id="apply-overlay">
  <div class="form-card">
    <div class="form-hdr">
      <div>
        <h2>Apply for Position</h2>
        <div class="job-ref" id="apply-job-ref"></div>
      </div>
      <button class="close-btn" onclick="closeApply()">&#10005;</button>
    </div>
    <div id="apply-form-content">
      <div class="form-body">
        <input type="hidden" id="af-jobid"/>
        <div class="frow">
          <div class="fg"><label>Full Name <span class="req">*</span></label><input type="text" id="af-name" placeholder="Your full legal name"/></div>
          <div class="fg"><label>Email <span class="req">*</span></label><input type="email" id="af-email" placeholder="your@email.com"/></div>
        </div>
        <div class="frow">
          <div class="fg"><label>Phone Number</label><input type="tel" id="af-phone" placeholder="+971 XX XXX XXXX"/></div>
          <div class="fg"><label>Nationality</label><input type="text" id="af-nationality" placeholder="e.g. India"/></div>
        </div>
        <div class="frow">
          <div class="fg"><label>Passport Number</label><input type="text" id="af-passport" placeholder="e.g. EA1234567"/></div>
          <div class="fg"><label>Years of Experience</label><input type="number" id="af-exp" placeholder="0" min="0"/></div>
        </div>
        <div class="frow">
          <div class="fg"><label>Current Company</label><input type="text" id="af-company" placeholder="Current employer (if any)"/></div>
          <div class="fg">
            <label>CV / Resume (PDF) <span class="req">*</span></label>
            <div class="file-upload-wrap" id="cv-drop-zone" onclick="document.getElementById('af-cv-file').click()">
              <span class="file-upload-label" id="cv-file-label">No file chosen</span>
              <button class="file-choose-btn" type="button">Browse</button>
              <input type="file" id="af-cv-file" class="file-upload-input" accept="application/pdf,.pdf" onchange="onCVFileChange(this)"/>
            </div>
            <span class="file-size-hint">PDF only &bull; Max 5 MB</span>
            <span class="upload-progress" id="cv-upload-progress">&#8987; Uploading CV to secure storage...</span>
          </div>
        </div>
        <div class="frow full">
          <div class="fg"><label>Cover Note</label><textarea id="af-cover" placeholder="Brief introduction and why you're applying..."></textarea></div>
        </div>
        <div class="err" id="af-err"></div>
      </div>
      <div class="form-ftr">
        <button class="btn-cancel" onclick="closeApply()">Cancel</button>
        <button class="btn-submit" id="af-submit" onclick="submitApplication()">Submit Application</button>
      </div>
    </div>
  </div>
</div>

<script>
var jobs = [];

/* ── Job list ─────────────────────────────────────────────── */
function loadJobs() {
  google.script.run
    .withSuccessHandler(function(r) {
      if (!r || !r.success || !r.data || !r.data.length) {
        document.getElementById('job-list').innerHTML =
          '<div class="empty"><div class="icon">&#128188;</div><p>No open positions at this time.<br>Check back soon!</p></div>';
        return;
      }
      jobs = r.data;
      renderJobs(r.data);
    })
    .withFailureHandler(function() {
      document.getElementById('job-list').innerHTML =
        '<div class="empty"><div class="icon">&#9888;</div><p>Unable to load jobs. Please try again later.</p></div>';
    })
    .getPublicJobs();
}

function renderJobs(data) {
  if (!data.length) {
    document.getElementById('job-list').innerHTML =
      '<div class="empty"><div class="icon">&#128188;</div><p>No open positions at this time.</p></div>';
    return;
  }
  document.getElementById('job-list').innerHTML = data.map(function(j) {
    var hasDesc = j.DESCRIPTION || j.REQUIREMENTS;
    var preview = (j.DESCRIPTION||'').slice(0, 120) + ((j.DESCRIPTION||'').length > 120 ? '…' : '');
    return '<div class="job-card">'+
      '<div class="job-card-main">'+
        '<div class="job-info">'+
          '<h3>'+esc(j.TITLE)+'</h3>'+
          '<div class="job-meta">'+
            (j.ENTITY   ? '<span class="job-tag entity">'+esc(j.ENTITY)+'</span>' : '')+
            (j.LOCATION ? '<span class="job-tag">&#128205; '+esc(j.LOCATION)+'</span>' : '')+
            (j.JOB_TYPE ? '<span class="job-tag type">'+esc(j.JOB_TYPE)+'</span>' : '')+
            (j.SALARY_RANGE ? '<span class="job-tag salary">&#128176; '+esc(j.SALARY_RANGE)+'</span>' : '')+
          '</div>'+
        '</div>'+
        '<button class="apply-btn" onclick="openApply(\''+esc(j.JOB_ID)+'\',\''+esc(j.TITLE)+'\')">Apply Now</button>'+
      '</div>'+
      (hasDesc ?
        '<div class="job-desc-bar">'+
          '<span class="desc-preview">'+esc(preview)+'</span>'+
          '<button class="desc-toggle" onclick="toggleDesc(\''+esc(j.JOB_ID)+'\',this)">Details &#9660;</button>'+
        '</div>'+
        '<div class="job-desc-full" id="desc-'+esc(j.JOB_ID)+'">'+
          (j.DESCRIPTION  ? '<h4>Description</h4><p>'+esc(j.DESCRIPTION)+'</p>'  : '')+
          (j.REQUIREMENTS ? '<h4>Requirements</h4><p>'+esc(j.REQUIREMENTS)+'</p>': '')+
        '</div>'
      : '')+
    '</div>';
  }).join('');
}

function toggleDesc(jobId, btn) {
  var el = document.getElementById('desc-'+jobId);
  if (!el) return;
  var open = el.style.display !== 'none' && el.style.display !== '';
  el.style.display = open ? 'none' : 'block';
  btn.innerHTML = open ? 'Details &#9660;' : 'Hide &#9650;';
}

/* ── Application form ─────────────────────────────────────── */
function onCVFileChange(input) {
  var file = input.files[0];
  var label = document.getElementById('cv-file-label');
  var zone  = document.getElementById('cv-drop-zone');
  if (!file) { label.textContent='No file chosen'; label.className='file-upload-label'; zone.className='file-upload-wrap'; return; }
  if (file.type !== 'application/pdf') {
    showErr('Please select a PDF file only.');
    input.value=''; label.textContent='No file chosen'; label.className='file-upload-label'; zone.className='file-upload-wrap'; return;
  }
  if (file.size > 5 * 1024 * 1024) {
    showErr('File too large. Maximum size is 5 MB.');
    input.value=''; label.textContent='No file chosen'; label.className='file-upload-label'; zone.className='file-upload-wrap'; return;
  }
  label.textContent = '&#10003; ' + file.name + ' (' + (file.size/1024).toFixed(0) + ' KB)';
  label.className = 'file-upload-label selected';
  zone.className = 'file-upload-wrap has-file';
  clearErr();
}

function openApply(jobId, title) {
  document.getElementById('af-jobid').value = jobId;
  document.getElementById('apply-job-ref').textContent = title;
  document.getElementById('apply-form-content').innerHTML = buildFormHTML();
  clearErr();
  document.getElementById('apply-overlay').classList.add('show');
}

function closeApply() {
  document.getElementById('apply-overlay').classList.remove('show');
}

function showErr(msg) {
  var e = document.getElementById('af-err'); if(e){ e.textContent=msg; e.style.display='block'; }
}
function clearErr() {
  var e = document.getElementById('af-err'); if(e){ e.textContent=''; e.style.display='none'; }
}

function setBtn(text, disabled) {
  var b = document.getElementById('af-submit'); if(b){ b.textContent=text; b.disabled=!!disabled; }
}

function submitApplication() {
  var jobId = (document.getElementById('af-jobid')||{}).value||'';
  var name  = ((document.getElementById('af-name')||{}).value||'').trim();
  var email = ((document.getElementById('af-email')||{}).value||'').trim();
  var phone = (document.getElementById('af-phone')||{}).value||'';
  var nat   = (document.getElementById('af-nationality')||{}).value||'';
  var pp    = (document.getElementById('af-passport')||{}).value||'';
  var exp   = (document.getElementById('af-exp')||{}).value||'';
  var comp  = (document.getElementById('af-company')||{}).value||'';
  var cover = (document.getElementById('af-cover')||{}).value||'';
  var fileInput = document.getElementById('af-cv-file');
  var file = fileInput ? fileInput.files[0] : null;

  if (!name || !email) { showErr('Full name and email are required.'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showErr('Please enter a valid email address.'); return; }
  if (!file) { showErr('Please upload your CV / Resume (PDF required).'); return; }
  clearErr();

  var job = jobs.find(function(j){ return j.JOB_ID === jobId; });
  var payload = {
    JOB_ID:           jobId,
    JOB_TITLE:        job ? job.TITLE : '',
    FULL_NAME:        name,
    EMAIL:            email,
    PHONE:            phone,
    NATIONALITY:      nat,
    PASSPORT_NO:      pp,
    EXPERIENCE_YEARS: exp,
    CURRENT_COMPANY:  comp,
    COVER_NOTE:       cover
  };

  // Step 1: upload CV to Drive
  setBtn('Uploading CV…', true);
  document.getElementById('cv-upload-progress').style.display = 'block';

  var reader = new FileReader();
  reader.onload = function(e) {
    var b64 = e.target.result.split(',')[1]; // strip data-URL prefix
    google.script.run
      .withSuccessHandler(function(r) {
        document.getElementById('cv-upload-progress').style.display = 'none';
        if (!r || !r.success) {
          showErr('CV upload failed: ' + (r ? r.error : 'unknown error'));
          setBtn('Submit Application', false);
          return;
        }
        payload.CV_DRIVE_LINK = r.url;
        doSubmit(payload, name);
      })
      .withFailureHandler(function(err) {
        document.getElementById('cv-upload-progress').style.display = 'none';
        showErr('CV upload error: ' + (err.message||err));
        setBtn('Submit Application', false);
      })
      .uploadCV(b64, file.name);
  };
  reader.onerror = function() {
    showErr('Failed to read file. Please try again.');
    setBtn('Submit Application', false);
  };
  reader.readAsDataURL(file);
}

function doSubmit(payload, name) {
  setBtn('Submitting…', true);
  google.script.run
    .withSuccessHandler(function(r) {
      if (!r || !r.success) {
        showErr(r ? r.error : 'Submission failed. Please try again.');
        setBtn('Submit Application', false);
        return;
      }
      var content = document.getElementById('apply-form-content');
      if (content) {
        content.innerHTML =
          '<div class="success-wrap">'+
            '<div class="success-icon">&#10003;&#65039;</div>'+
            '<h3>Application Submitted!</h3>'+
            '<p>Thank you, <strong>'+esc(name)+'</strong>. Your application has been received.<br>Our HR team will review your CV and be in touch shortly.</p>'+
            '<div style="margin-top:20px"><button class="btn-cancel" onclick="closeApply()" style="background:#1e4799;color:#fff">Close</button></div>'+
          '</div>';
      }
    })
    .withFailureHandler(function(e) {
      showErr('Server error: ' + (e.message||e));
      setBtn('Submit Application', false);
    })
    .submitApplication(payload);
}

function buildFormHTML() {
  return '<div class="form-body">'+
    '<input type="hidden" id="af-jobid" value="'+esc((document.getElementById('af-jobid')||{}).value||'')+'"/>'+
    '<div class="frow">'+
      '<div class="fg"><label>Full Name <span class="req">*</span></label><input type="text" id="af-name" placeholder="Your full legal name"/></div>'+
      '<div class="fg"><label>Email <span class="req">*</span></label><input type="email" id="af-email" placeholder="your@email.com"/></div>'+
    '</div>'+
    '<div class="frow">'+
      '<div class="fg"><label>Phone Number</label><input type="tel" id="af-phone" placeholder="+971 XX XXX XXXX"/></div>'+
      '<div class="fg"><label>Nationality</label><input type="text" id="af-nationality" placeholder="e.g. India"/></div>'+
    '</div>'+
    '<div class="frow">'+
      '<div class="fg"><label>Passport Number</label><input type="text" id="af-passport" placeholder="e.g. EA1234567"/></div>'+
      '<div class="fg"><label>Years of Experience</label><input type="number" id="af-exp" placeholder="0" min="0"/></div>'+
    '</div>'+
    '<div class="frow">'+
      '<div class="fg"><label>Current Company</label><input type="text" id="af-company" placeholder="Current employer (if any)"/></div>'+
      '<div class="fg">'+
        '<label>CV / Resume (PDF) <span class="req">*</span></label>'+
        '<div class="file-upload-wrap" id="cv-drop-zone" onclick="document.getElementById(\'af-cv-file\').click()">'+
          '<span class="file-upload-label" id="cv-file-label">No file chosen</span>'+
          '<button class="file-choose-btn" type="button">Browse</button>'+
          '<input type="file" id="af-cv-file" class="file-upload-input" accept="application/pdf,.pdf" onchange="onCVFileChange(this)"/>'+
        '</div>'+
        '<span class="file-size-hint">PDF only &bull; Max 5 MB</span>'+
        '<span class="upload-progress" id="cv-upload-progress">&#8987; Uploading CV to secure storage...</span>'+
      '</div>'+
    '</div>'+
    '<div class="frow full"><div class="fg"><label>Cover Note</label><textarea id="af-cover" placeholder="Brief introduction and why you are applying..."></textarea></div></div>'+
    '<div class="err" id="af-err"></div>'+
  '</div>'+
  '<div class="form-ftr">'+
    '<button class="btn-cancel" onclick="closeApply()">Cancel</button>'+
    '<button class="btn-submit" id="af-submit" onclick="submitApplication()">Submit Application</button>'+
  '</div>';
}

function esc(v) {
  return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('apply-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeApply();
});

window.addEventListener('DOMContentLoaded', loadJobs);
</script>
</body>
</html>
